limit_req_zone $binary_remote_addr zone=djgabo_login:10m rate=10r/m;
log_format djgabo_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name panel.kitkaraoke.com;
    access_log /var/log/nginx/djgabo-panel.access.log djgabo_safe;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.kitkaraoke.com;
    access_log /var/log/nginx/djgabo-panel.access.log djgabo_safe;

    ssl_certificate /etc/letsencrypt/live/panel.kitkaraoke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.kitkaraoke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 800m;
    client_body_timeout 180s;
    send_timeout 3600s;

    location = / {
        root /opt/djgabo-portal;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8765;
    }

    location = /_portal_auth_any {
        internal;
        proxy_pass http://127.0.0.1:8765/api/portal/auth/any;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /_portal_auth_admin {
        internal;
        proxy_pass http://127.0.0.1:8765/api/portal/auth/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_required { return 302 /; }
    location @admin_required { return 302 /?admin_required=1; }

    location = /cdg { return 301 /cdg/; }
    location /cdg/ {
        auth_request /_portal_auth_any;
        error_page 401 403 = @login_required;
        proxy_pass http://127.0.0.1:8765/;
        include /etc/nginx/proxy_params;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /cdg-lyrics { return 301 /cdg-lyrics/; }
    location /cdg-lyrics/ {
        auth_request /_portal_auth_admin;
        error_page 401 403 = @admin_required;
        rewrite ^/cdg-lyrics/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /p-youtube { return 301 /p-youtube/; }
    location ^~ /p-youtube/q/ {
        rewrite ^/p-youtube/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/proxy_params;
    }
    location ~ ^/p-youtube/api/channels/[0-9]+/oauth/callback$ {
        rewrite ^/p-youtube/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/proxy_params;
    }
    location /p-youtube/ {
        auth_request /_portal_auth_admin;
        error_page 401 403 = @admin_required;
        rewrite ^/p-youtube/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/proxy_params;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/call/iniciarSesionConsola {
        limit_req zone=djgabo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/proxy_params;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/proxy_params;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /editor-v1 {
        auth_request /_portal_auth_any;
        error_page 401 403 = @login_required;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/proxy_params;
    }
    location /dropbox/ {
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/proxy_params;
    }
}
