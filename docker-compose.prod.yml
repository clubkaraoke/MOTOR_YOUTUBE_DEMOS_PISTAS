services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8088"
      DATABASE_URL: sqlite:////data/db/djgabo_engine.db
      REDIS_URL: redis://redis:6379/0
      LOCAL_SYNC_FALLBACK: "false"
      DATA_ROOT: /data
      GOOGLE_CREDENTIALS_FILE: /data/google-auth/gcloud/application_default_credentials.json
      YOUTUBE_OAUTH_CLIENT_FILE: /data/google-auth/youtube-oauth-client.json
      TOKEN_ENCRYPTION_KEY_FILE: /data/google-auth/youtube-token.key
      PUBLIC_BASE_URL: https://panel.kitkaraoke.com/p-youtube
      OAUTH_REDIRECT_BASE_URL: https://panel.kitkaraoke.com/p-youtube
      YOUTUBE_MODE: real
      GOOGLE_MODE: real
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8088", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/db/djgabo_engine.db
      REDIS_URL: redis://redis:6379/0
      LOCAL_SYNC_FALLBACK: "false"
      DATA_ROOT: /data
      GOOGLE_CREDENTIALS_FILE: /data/google-auth/gcloud/application_default_credentials.json
      YOUTUBE_OAUTH_CLIENT_FILE: /data/google-auth/youtube-oauth-client.json
      TOKEN_ENCRYPTION_KEY_FILE: /data/google-auth/youtube-token.key
      PUBLIC_BASE_URL: https://panel.kitkaraoke.com/p-youtube
      OAUTH_REDIRECT_BASE_URL: https://panel.kitkaraoke.com/p-youtube
      YOUTUBE_MODE: real
      GOOGLE_MODE: real
      RENDER_CONCURRENCY: "1"
    command: ["python", "-m", "app.workers.worker"]
    stop_grace_period: 5m
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  lyrics:
    build:
      context: ./lyrics_engine
    container_name: djgabo-cdg-lyrics
    mem_limit: 2g
    env_file: .env
    environment:
      CDG_LAB_DATA_DIR: /data/cdg_lab
      DROPBOX_APP_KEY: guz0zl0p94fhw6n
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      DROPBOX_REDIRECT_URI: https://panel.kitkaraoke.com/cdg-lyrics/api/lab/dropbox/callback
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data/cdg_lab:/data/cdg_lab
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  redis_data:
