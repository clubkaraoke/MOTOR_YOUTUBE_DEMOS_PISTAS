name: Diagnose CDG Editor IA submit once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cdg-editor-ia-submit-once.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Capture submit diagnostics
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-editor-ia-submit-current.txt <<'REMOTE'
          set +e
          echo "TIMESTAMP=$(date -Is)"
          echo "=== SERVICE ==="
          sudo systemctl is-active djgabo-cdg-ia-test
          echo
          echo "=== JOURNAL LAST 20M ==="
          sudo journalctl -u djgabo-cdg-ia-test --since "20 min ago" --no-pager -o short-iso | tail -400
          echo
          echo "=== NGINX CREATE-JOB LAST 20M ==="
          sudo awk -v d="$(date -d '20 min ago' '+%d/%b/%Y:%H:%M')" '/cdg-editor-ia\/api\/ai\/create-job\/start/ {print}' /var/log/nginx/djgabo-panel.access.log | tail -80
          echo
          echo "=== NGINX ERROR LAST 20M ==="
          sudo tail -250 /var/log/nginx/error.log
          echo
          echo "=== LATEST IA TEST JOBS ==="
          sudo -u djgabo-cdg env DJGABO_ENV=test DJGABO_TEST_MODE=1 DJGABO_URL_PREFIX=/cdg-editor-ia DJGABO_DATA_DIR=/var/lib/djgabo-cdg-ia-test DJGABO_DB_PATH=/var/lib/djgabo-cdg-ia-test/local.db /opt/djgabo-cdg-ia-test/.venv/bin/python - <<'PY'
          import sqlite3
          p='/var/lib/djgabo-cdg-ia-test/local.db'
          c=sqlite3.connect(p)
          c.row_factory=sqlite3.Row
          for r in c.execute("select id,artist,title,status,updated,voice_filename,instrumental_filename from jobs order by updated desc limit 8"):
              print(dict(r))
          PY
          echo
          echo "=== DISK/RAM ==="
          df -h /
          free -h
          REMOTE

      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-editor-ia-submit-current.txt
          git commit -m "diag: capture IA submit failure" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
