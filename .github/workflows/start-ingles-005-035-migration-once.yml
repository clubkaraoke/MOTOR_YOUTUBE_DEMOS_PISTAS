name: Start INGLES 005-035 migration once

on:
  push:
    paths:
      - ".github/workflows/start-ingles-005-035-migration-once.yml"

permissions:
  contents: read

concurrency:
  group: kitkaraoke-data-sync-ovh
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout KIT sync repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clubkaraoke/KITKARAOKE_DATA_SYNC
          ref: main
          path: kit-source

      - name: Validate SSH secrets
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST"
          test -n "$OVH_PORT"
          test -n "$OVH_SSH_KEY"
          test -n "$OVH_USER"

      - name: Configure OVH SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload migration runner
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" kit-source/scripts/migrate_ingles_remaining.sh \
            "$OVH_USER@$OVH_HOST:/tmp/migrate_ingles_remaining.sh"

      - name: Start durable sequential migration on OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          UNIT="kitkaraoke-ingles-migration-005-035"
          APP="/opt/KITKARAOKE_DATA_SYNC"

          sudo install -m 755 /tmp/migrate_ingles_remaining.sh "$APP/scripts/migrate_ingles_remaining.sh"
          rm -f /tmp/migrate_ingles_remaining.sh

          # No lanzar una segunda migración si ya hay una activa.
          if sudo systemctl is-active --quiet "$UNIT"; then
            echo "La migración ya está activa."
            sudo systemctl --no-pager --full status "$UNIT" || true
            exit 0
          fi

          # Verificar que el bloque 004 quedó conciliado antes de continuar.
          cd "$APP"
          sudo bash scripts/reconcile_block.sh 4

          # Tarea durable en systemd: sigue aunque termine GitHub Actions o se cierre la PC.
          sudo systemd-run \
            --unit="$UNIT" \
            --description="KITKARAOKE INGLES blocks 005-035 sequential migration" \
            --property=Nice=10 \
            /bin/bash "$APP/scripts/migrate_ingles_remaining.sh" 5 35

          sleep 5
          sudo systemctl is-active "$UNIT"
          sudo journalctl -u "$UNIT" -n 30 --no-pager
          REMOTE
