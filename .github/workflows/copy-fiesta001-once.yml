name: Copy FIESTA 001 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copy-fiesta001-once.yml"

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"

      - name: Precheck FIESTA_001
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "cd /opt/KITKARAOKE_DATA_SYNC && sudo docker compose run --rm --no-deps -T \
            -e DATASET_KEY=01_FIESTA \
            -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA' \
            -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA \
            -e BLOCK_PREFIX=FIESTA_ \
            -e BLOCK_SIZE=130 \
            -e DRY_RUN=true \
            -e AUTO_SYNC=false \
            -e MIN_EXPECTED_SOURCE_COUNT=5000 \
            kitkaraoke-data-sync python -m app.cli reconcile-block 1"

      - name: Copy FIESTA_001
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "cd /opt/KITKARAOKE_DATA_SYNC && sudo docker compose run --rm --no-deps -T \
            -e DATASET_KEY=01_FIESTA \
            -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA' \
            -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA \
            -e BLOCK_PREFIX=FIESTA_ \
            -e BLOCK_SIZE=130 \
            -e DRY_RUN=false \
            -e AUTO_SYNC=false \
            -e MIN_EXPECTED_SOURCE_COUNT=5000 \
            kitkaraoke-data-sync python -m app.cli copy-block 1"

      - name: Publish master catalog
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "cd /opt/KITKARAOKE_DATA_SYNC && sudo bash scripts/publish_global_catalog.sh"

      - name: Verify FIESTA_001
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "cd /opt/KITKARAOKE_DATA_SYNC && sudo docker compose run --rm --no-deps -T \
            -e DATASET_KEY=01_FIESTA \
            -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA' \
            -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA \
            -e BLOCK_PREFIX=FIESTA_ \
            -e BLOCK_SIZE=130 \
            -e DRY_RUN=true \
            -e AUTO_SYNC=false \
            -e MIN_EXPECTED_SOURCE_COUNT=5000 \
            kitkaraoke-data-sync python -m app.cli reconcile-block 1"
