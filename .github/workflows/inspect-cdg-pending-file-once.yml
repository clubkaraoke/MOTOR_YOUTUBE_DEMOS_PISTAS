name: Inspect CDG pending file once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-pending-file-once.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Inspect pending CDG
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-pending-file-live.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          D=/var/lib/djgabo-cdg-ia-test/pending/cdg
          echo "DIR=$D"
          sudo -u djgabo-cdg find "$D" -maxdepth 2 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS | %s | %p\n' 2>/dev/null | sort -r | head -30 || true
          echo "=== LET0078 CONTENT ==="
          sudo -u djgabo-cdg find "$D" -type f -iname '*LET-0078*' -o -type f -iname '*Amor Rebelde*' 2>/dev/null | sort || true
          REMOTE

      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-pending-file-live.txt
          git commit -m "diag: inspect pending CDG file" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
