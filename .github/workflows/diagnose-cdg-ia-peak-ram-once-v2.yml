name: Diagnose CDG IA peak RAM once v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cdg-ia-peak-ram-once-v2.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect peak memory only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-peak-ram-v2.txt <<'REMOTE'
          set -euo pipefail
          echo "TIMESTAMP=$(date -Is)"
          echo
          echo "=== SERVER CURRENT ==="
          free -h
          echo
          echo "=== CONTAINER CURRENT ==="
          sudo docker stats --no-stream cdg-ai-sync-cpu cdg-ia-sync-test --format 'name={{.Name}} mem={{.MemUsage}} cpu={{.CPUPerc}}'
          echo

          for C in cdg-ai-sync-cpu cdg-ia-sync-test; do
            echo "=== $C ==="
            PID="$(sudo docker inspect -f '{{.State.Pid}}' "$C")"
            LIMIT="$(sudo docker inspect -f '{{.HostConfig.Memory}}' "$C")"
            OOM="$(sudo docker inspect -f '{{.State.OOMKilled}}' "$C")"
            RESTART="$(sudo docker inspect -f '{{.RestartCount}}' "$C")"
            CGREL="$(awk -F: '$1=="0"{print $3}' /proc/$PID/cgroup)"
            CG="/sys/fs/cgroup$CGREL"
            CURRENT="$(sudo cat "$CG/memory.current" 2>/dev/null || echo NA)"
            PEAK="$(sudo cat "$CG/memory.peak" 2>/dev/null || echo NA)"
            MAX="$(sudo cat "$CG/memory.max" 2>/dev/null || echo NA)"
            echo "pid=$PID"
            echo "docker_limit_bytes=$LIMIT"
            echo "memory_current_bytes=$CURRENT"
            echo "memory_peak_bytes=$PEAK"
            echo "memory_max=$MAX"
            echo "oom_killed=$OOM"
            echo "restart_count=$RESTART"
            if [ "$CURRENT" != "NA" ] && [ "$PEAK" != "NA" ]; then
              python3 - "$CURRENT" "$PEAK" "$LIMIT" <<'PY'
          import sys
          cur=int(sys.argv[1]); peak=int(sys.argv[2]); lim=int(sys.argv[3])
          mib=lambda x:x/1024/1024
          gib=lambda x:x/1024/1024/1024
          print(f"current_mib={mib(cur):.1f}")
          print(f"peak_mib={mib(peak):.1f}")
          print(f"peak_gib={gib(peak):.3f}")
          if lim>0:
              print(f"limit_gib={gib(lim):.3f}")
              print(f"peak_pct_of_limit={peak/lim*100:.1f}%")
          PY
            fi
            echo "--- memory.events ---"
            sudo cat "$CG/memory.events" 2>/dev/null || true
            echo
          done
          REMOTE
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-ia-peak-ram-v2.txt
          git commit -m "diag: record CDG IA peak RAM v2" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
