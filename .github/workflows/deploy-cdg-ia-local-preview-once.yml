name: Deploy CDG IA local preview once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cdg-ia-local-preview-once.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostics repo
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Deploy local preview LAB
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-local-preview-deploy.txt <<'REMOTE'
          set -euo pipefail
          BASE=/opt/cdg-ia-sync-test
          echo "TIMESTAMP=$(date -Is)"
          echo
          echo "=== BEFORE ==="
          df -h /
          free -h
          sudo docker ps --filter name=cdg-ia-sync-test --format 'name={{.Names}} image={{.Image}} status={{.Status}}'
          echo

          if [ ! -d "$BASE/.git" ]; then
            echo "ERROR: $BASE no es checkout Git"
            exit 51
          fi

          cd "$BASE"
          git fetch origin main
          git reset --hard origin/main

          echo
          echo "=== BUILD + RECREATE LAB ONLY ==="
          sudo docker compose up -d --build cdg-ia-sync-test

          echo
          echo "=== VERIFY ==="
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8097/ >/tmp/cdg-ia-home.html; then
              break
            fi
            sleep 2
          done
          grep -q "CDG IA Sync LAB" /tmp/cdg-ia-home.html
          curl -fsS http://127.0.0.1:8097/api/health
          echo
          sudo docker ps --filter name=cdg-ia-sync-test --format 'name={{.Names}} image={{.Image}} status={{.Status}}'
          sudo docker stats --no-stream cdg-ia-sync-test --format 'ram={{.MemUsage}} cpu={{.CPUPerc}}'
          echo
          echo "=== AFTER ==="
          df -h /
          free -h
          REMOTE

      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-ia-local-preview-deploy.txt
          git commit -m "diag: record CDG IA local preview deploy" || exit 0
          git push origin HEAD:main
