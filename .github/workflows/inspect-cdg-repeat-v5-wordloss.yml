name: Inspect CDG repeat v5 word loss

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-repeat-v5-wordloss.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect words
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-repeat-v5-wordloss.txt 2>&1 <<'REMOTE'
          ROOT=/opt/djgabo-cdg-ia-test
          cd "$ROOT"
          sudo -u djgabo-cdg env             DJGABO_ENV=test             DJGABO_TEST_MODE=1             DJGABO_URL_PREFIX=/cdg-editor-ia             DJGABO_DATA_DIR=/var/lib/djgabo-cdg-ia-test             DJGABO_CONFIG_DIR=/var/lib/djgabo-cdg-ia-test/config             DJGABO_DB_PATH=/var/lib/djgabo-cdg-ia-test/local.db             DJGABO_JOBS_DIR=/var/lib/djgabo-cdg-ia-test/jobs             DJGABO_OUTPUT_DIR=/var/lib/djgabo-cdg-ia-test/output             DJGABO_VOICE_CACHE_DIR=/var/lib/djgabo-cdg-ia-test/voice_cache             "$ROOT/.venv/bin/python" - <<'PY'
          import json, statistics, server
          with server.db() as c:
              r=c.execute("select id,project_json from jobs where id='LET-0078'").fetchone()
          doc=json.loads(dict(r).get('project_json') or '{}')
          words=[w for s in doc.get('segments') or [] for w in s.get('words') or []]
          for a,b in [(155.0,184.0),(270.0,298.5)]:
              arr=[w for w in words if w.get('start_time') is not None and a<=float(w['start_time'])<=b]
              print('\nWINDOW',a,b,'count',len(arr))
              losses=[]
              for i,w in enumerate(arr,1):
                  loss=w.get('ai_loss')
                  if isinstance(loss,(int,float)): losses.append(float(loss))
                  print(i,repr(w.get('text')),'st',w.get('start_time'),'en',w.get('end_time'),'dur',None if w.get('end_time') is None else round(float(w['end_time'])-float(w['start_time']),3),'loss',loss,'match',w.get('ai_match_type'))
              if losses:
                  print('LOSS stats min/med/max',round(min(losses),4),round(statistics.median(losses),4),round(max(losses),4))
          PY
          REMOTE
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-repeat-v5-wordloss.txt
          git commit -m "diag: inspect repeat word losses" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
