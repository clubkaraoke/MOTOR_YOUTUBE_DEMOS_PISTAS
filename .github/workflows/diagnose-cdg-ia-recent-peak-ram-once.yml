name: Diagnose CDG IA recent peak RAM once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cdg-ia-recent-peak-ram-once.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect cgroup memory peaks
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-recent-peak-ram.txt <<'REMOTE'
          set -euo pipefail
          echo "TIMESTAMP=$(date -Is)"
          echo

          echo "=== SERVER CURRENT ==="
          free -h
          echo

          echo "=== CONTAINER CURRENT ==="
          sudo docker stats --no-stream cdg-ai-sync-cpu cdg-ia-sync-test --format 'name={{.Name}} mem={{.MemUsage}} cpu={{.CPUPerc}}'
          echo

          for C in cdg-ai-sync-cpu cdg-ia-sync-test; do
            echo "=== $C ==="
            PID="$(sudo docker inspect -f '{{.State.Pid}}' "$C")"
            echo "pid=$PID"
            echo "docker_memory_limit=$(sudo docker inspect -f '{{.HostConfig.Memory}}' "$C")"
            echo "oom_killed=$(sudo docker inspect -f '{{.State.OOMKilled}}' "$C")"
            echo "restart_count=$(sudo docker inspect -f '{{.RestartCount}}' "$C")"
            CGREL="$(awk -F: '$1=="0"{print $3}' /proc/$PID/cgroup)"
            CG="/sys/fs/cgroup$CGREL"
            echo "cgroup=$CG"
            for f in memory.current memory.peak memory.max memory.high memory.swap.current memory.swap.max memory.events memory.events.local; do
              if [ -e "$CG/$f" ]; then
                echo "--- $f ---"
                sudo cat "$CG/$f"
              fi
            done
            echo
          done

          echo "=== RECENT IA JOBS ==="
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/opt/cdg-ia-sync-test/runtime/events.jsonl")
          if not p.exists():
              print("events file not found")
          else:
              for line in p.read_text(encoding="utf-8", errors="replace").splitlines()[-1000:]:
                  try: r=json.loads(line)
                  except: continue
                  if r.get("event") in {"local_cpu_align_started","local_cpu_align_done","local_cpu_align_error"}:
                      print(json.dumps(r, ensure_ascii=False))
          PY
          REMOTE
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-ia-recent-peak-ram.txt
          git commit -m "diag: record CDG IA recent peak RAM" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
