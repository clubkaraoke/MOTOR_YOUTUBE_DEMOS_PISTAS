name: Inspect nginx PUT policy CDG V2 once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-nginx-put-policy-cdg-v2-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE' 2>&1 | tee diagnostics/cdg-v2-nginx-put-policy.txt
          set -euo pipefail
          echo "=== AUTH ADMIN BLOCK ==="
          sudo nginx -T 2>/dev/null | sed -n '/location = \/_portal_auth_admin/,+35p'
          echo "=== METHOD RESTRICTIONS ==="
          sudo nginx -T 2>/dev/null | grep -nE 'limit_except|request_method|405|auth_request|error_page' | head -160 || true
          echo "=== LOCAL PUT DUMMY ==="
          curl -sS -i -X PUT http://127.0.0.1:8787/api/v2/uploads/test/voice -H 'X-Session-Token: bogus' --data-binary 'abc' | sed -n '1,25p' || true
          echo "=== RECENT ACCESS AROUND V2 UPLOAD ==="
          sudo grep 'cdg-v2/api/v2/uploads' /var/log/nginx/access.log | tail -40 || true
          echo "=== RECENT ERROR ==="
          sudo tail -100 /var/log/nginx/error.log || true
          REMOTE
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-v2-nginx-put-policy.txt
          git commit -m "diag: inspect nginx PUT policy for V2" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
