name: Inspect LET-0120 sheet state transition once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-let0120-sheet-state-transition-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect state and callers
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'sudo python3 -' <<'PY'
          import sqlite3, json
          from pathlib import Path
          db=sqlite3.connect("file:/var/lib/djgabo-cdg/local.db?mode=ro",uri=True);db.row_factory=sqlite3.Row
          r=db.execute("select id,origin,sheet_master_status,sheet_master_error,voice_drive_status,timings_drive_status,dropbox_status from jobs where id='LET-0120'").fetchone()
          print("STATE="+json.dumps(dict(r),ensure_ascii=False,default=str) if r else "NONE")
          db.close()
          s=Path("/opt/djgabo-cdg/server.py").read_text(encoding="utf-8")
          for phrase in ["Sheet maestro al abrir", "master_sync(jid", "_sheet_managed(r)", "sheet_master_status='PENDIENTE'"]:
              print("\n==== "+phrase+" ====")
              start=0; hits=0
              while hits<12:
                  i=s.find(phrase,start)
                  if i<0: break
                  print(s[max(0,i-800):min(len(s),i+1800)])
                  print("---")
                  start=i+len(phrase);hits+=1
          PY
