name: Inspect CDG sustained end once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-sustained-end-once.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect live code
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-sustained-end-live.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          F=/opt/djgabo-cdg-ia-test/editor_v1/index.html
          echo "=== VOICE GAP / QA ==="
          sudo -u djgabo-cdg grep -n -B12 -A35 -E "voice_gaps|aiQaBar|vocaliz|voz sin texto" "$F" | head -260 || true
          echo "=== END / REFRESH ==="
          sudo -u djgabo-cdg grep -n -B12 -A45 -E "refreshEnds|end_time|tailSeconds|fallbackEnd" "$F" | head -360 || true
          echo "=== LINE/SEGMENT HELPERS ==="
          sudo -u djgabo-cdg grep -n -B8 -A25 -E "function .*line|lineIndex|seg|segment" "$F" | head -260 || true
          REMOTE
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-sustained-end-live.txt
          git commit -m "diag: inspect sustained word end logic" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
