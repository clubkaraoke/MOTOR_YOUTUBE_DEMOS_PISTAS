name: Deploy Karaoke total timeline V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cdg-karaoke-total-timeline-v1.yml"
      - "deploy/cdg_karaoke_total_timeline_v1/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate patch
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/cdg_karaoke_total_timeline_v1/patch_production.py

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Patch production editor and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          scp -P "$OVH_PORT" deploy/cdg_karaoke_total_timeline_v1/patch_production.py "$OVH_USER@$OVH_HOST:/tmp/patch_cdg_karaoke_total_timeline_v1.py"

          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-karaoke-total-timeline-v1-deploy.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/djgabo-cdg
          EDITOR="$ROOT/editor_v1/index.html"
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$ROOT/backups/karaoke_total_timeline_$STAMP"

          echo "TIMESTAMP=$(date -Is)"
          echo "SERVICE_BEFORE=$(sudo systemctl is-active djgabo-cdg)"
          echo "HTTP_BEFORE=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)"
          test "$(sudo systemctl is-active djgabo-cdg)" = active

          sudo mkdir -p "$BACKUP/editor_v1"
          sudo cp "$EDITOR" "$BACKUP/editor_v1/index.html"
          echo "BACKUP=$BACKUP"

          # Prueba primero sobre copia para no tocar producción si algún anchor cambió.
          sudo rm -rf /tmp/djgabo-karaoke-timeline-stage
          sudo mkdir -p /tmp/djgabo-karaoke-timeline-stage/editor_v1
          sudo cp "$EDITOR" /tmp/djgabo-karaoke-timeline-stage/editor_v1/index.html
          sudo python3 /tmp/patch_cdg_karaoke_total_timeline_v1.py --root /tmp/djgabo-karaoke-timeline-stage
          sudo grep -Fq 'DJGABO_KARAOKE_TOTAL_TIMELINE_V1' /tmp/djgabo-karaoke-timeline-stage/editor_v1/index.html
          sudo grep -Fq 'CDG_TOTAL_TIMELINE_DIAG_V2' /tmp/djgabo-karaoke-timeline-stage/editor_v1/index.html
          sudo grep -Fq 'predicted_intro_delay_seconds' /tmp/djgabo-karaoke-timeline-stage/editor_v1/index.html
          sudo grep -Fq 'KARAOKE · OPENING' /tmp/djgabo-karaoke-timeline-stage/editor_v1/index.html
          sudo grep -Fq 'KARAOKE · ENDING' /tmp/djgabo-karaoke-timeline-stage/editor_v1/index.html
          echo "STAGE=PASS"

          sudo python3 /tmp/patch_cdg_karaoke_total_timeline_v1.py --root "$ROOT"
          sudo chown djgabo-cdg:djgabo-cdg "$EDITOR"

          sudo grep -Fq 'DJGABO_KARAOKE_TOTAL_TIMELINE_V1' "$EDITOR"
          sudo grep -Fq 'CDG_TOTAL_TIMELINE_DIAG_V2' "$EDITOR"
          sudo grep -Fq 'timeline:pvTimelineDiagnostic()' "$EDITOR"

          # Cambio sólo frontend: NO reiniciamos producción ni invalidamos sesión.
          code="$(curl -sS -o /tmp/editor-total-timeline.html -w '%{http_code}' 'http://127.0.0.1:8765/editor-v1?embed=1')"
          echo "EDITOR_HTTP=$code"
          test "$code" = 200
          grep -Fq 'DJGABO_KARAOKE_TOTAL_TIMELINE_V1' /tmp/editor-total-timeline.html
          grep -Fq 'CDG_TOTAL_TIMELINE_DIAG_V2' /tmp/editor-total-timeline.html

          echo "SERVICE_AFTER=$(sudo systemctl is-active djgabo-cdg)"
          echo "HTTP_AFTER=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)"
          echo "DEPLOY=OK"
          REMOTE

      - name: Save deploy report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-karaoke-total-timeline-v1-deploy.txt ]; then
            git add diagnostics/cdg-karaoke-total-timeline-v1-deploy.txt
            git commit -m "diag: record Karaoke total timeline V1 deploy" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
