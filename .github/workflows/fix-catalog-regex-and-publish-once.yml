name: Fix catalog regex and publish once

on:
  push:
    paths:
      - ".github/workflows/fix-catalog-regex-and-publish-once.yml"

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -H "$OVH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload fixed catalog builder
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/universal_catalog.py
          scp -P "$OVH_PORT" /tmp/universal_catalog.py "$OVH_USER@$OVH_HOST:/tmp/kitkaraoke-universal_catalog.py"

      - name: Rebuild and publish
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/opt/KITKARAOKE_DATA_SYNC
          sudo install -m 0644 /tmp/kitkaraoke-universal_catalog.py "$APP/app/universal_catalog.py"
          rm -f /tmp/kitkaraoke-universal_catalog.py
          cd "$APP"
          sudo docker compose up -d --build kitkaraoke-data-sync
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:8091/health
          sudo bash "$APP/deploy/publish_universal_catalog.sh"
          REMOTE

      - name: Verify public JSON
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 https://panel.kitkaraoke.com/catalogo/03_INGLES.json -o catalog.json
          python3 -c 'import json; d=json.load(open("catalog.json",encoding="utf-8")); print("count=",d.get("count"),"blocks=",d.get("blocks")); assert d.get("count")==4534; assert d.get("blocks")==35; assert all(x.get("driveFileId") for x in d.get("items",[]))'
