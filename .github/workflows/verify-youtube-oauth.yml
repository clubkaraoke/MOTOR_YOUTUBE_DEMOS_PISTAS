name: Verify YouTube OAuth channels

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"

      - name: Verify all channels against YouTube
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/djgabo-youtube
          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          from sqlalchemy import func, select
          from app.core.database import SessionLocal
          from app.models.entities import Channel, Job
          from app.services.youtube import _service

          expected = {
              1: "Pistas Musicales El Club",
              2: "DJ ZETA",
              3: "Pistas Musicales GO!",
              4: "DJMABEX - Ediciones a pedido",
          }

          with SessionLocal() as db:
              channels = db.scalars(select(Channel).order_by(Channel.id)).all()
              for channel in channels:
                  try:
                      response = _service(channel).channels().list(part="id,snippet", mine=True).execute()
                      items = response.get("items", [])
                      title = items[0].get("snippet", {}).get("title") if items else None
                      match = bool(title and title.strip() == expected.get(channel.id, "").strip())
                      print(
                          "CHANNEL_VERIFY",
                          channel.id,
                          channel.display_name,
                          "DB_STATUS="+str(channel.oauth_status),
                          "API=OK" if items else "API=NO_CHANNEL",
                          "TITLE="+str(title),
                          "EXPECTED_MATCH="+str(match),
                      )
                  except Exception as exc:
                      msg = str(exc)
                      reason = "INVALID_GRANT" if "invalid_grant" in msg else ("EXPIRED_OR_REVOKED" if "expired or revoked" in msg else type(exc).__name__)
                      print(
                          "CHANNEL_VERIFY",
                          channel.id,
                          channel.display_name,
                          "DB_STATUS="+str(channel.oauth_status),
                          "API=ERROR",
                          "REASON="+reason,
                      )

              counts = db.execute(
                  select(Job.status, func.count(Job.id)).group_by(Job.status).order_by(Job.status)
              ).all()
              print("JOB_STATUS_COUNTS", {status: count for status, count in counts})
              stuck = db.scalar(
                  select(func.count(Job.id)).where(
                      Job.youtube_video_id.is_(None),
                      Job.status.in_(["UPLOADING_YOUTUBE","UPLOAD_ERROR","QUEUED","VERIFYING"])
                  )
              ) or 0
              print("RECOVERABLE_WITHOUT_VIDEO", stuck)
          PY
          REMOTE
