name: Diagnose CDG IA process RSS once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cdg-ia-process-rss-once.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect process RSS/HWM
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-process-rss.txt <<'REMOTE'
          set -euo pipefail
          echo "TIMESTAMP=$(date -Is)"
          echo "=== WORKER PROCESS 1 STATUS ==="
          sudo docker exec cdg-ai-sync-cpu sh -c 'grep -E "^(Name|Pid|VmPeak|VmSize|VmHWM|VmRSS|RssAnon|RssFile|RssShmem):" /proc/1/status'
          echo
          echo "=== WORKER SMAPS ROLLUP ==="
          sudo docker exec cdg-ai-sync-cpu sh -c 'cat /proc/1/smaps_rollup 2>/dev/null | grep -E "^(Rss|Pss|Private|Shared|Anonymous|LazyFree|Swap):" || true'
          echo
          echo "=== WEB PROCESS 1 STATUS ==="
          sudo docker exec cdg-ia-sync-test sh -c 'grep -E "^(Name|Pid|VmPeak|VmSize|VmHWM|VmRSS|RssAnon|RssFile|RssShmem):" /proc/1/status'
          REMOTE
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-ia-process-rss.txt
          git commit -m "diag: record CDG IA process RSS" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
