name: Deploy seven CDG IA improvements
# trigger-7-improvements

on:
  push:
    branches: [main]
    paths:
      - "deploy/patch_cdg_editor_ia_7_improvements.py"
      - ".github/workflows/deploy-cdg-editor-ia-7-improvements.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdg-editor-ia-seven-improvements
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate patch
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/patch_cdg_editor_ia_7_improvements.py

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Upload patch
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" deploy/patch_cdg_editor_ia_7_improvements.py "$OVH_USER@$OVH_HOST:/tmp/patch_cdg_editor_ia_7_improvements.py"
          scp -P "$OVH_PORT" deploy/vendor/jsQR.js "$OVH_USER@$OVH_HOST:/tmp/jsQR.js"

      - name: Apply, repair current test, verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE' 2>&1 | tee diagnostics/cdg-editor-ia-7-improvements.txt
          set -euo pipefail
          echo "TIMESTAMP=$(date -Is)"
          echo "PRODUCTION_BEFORE=$(sudo systemctl is-active djgabo-cdg)"
          echo "TEST_BEFORE=$(sudo systemctl is-active djgabo-cdg-ia-test)"

          sudo python3 /tmp/patch_cdg_editor_ia_7_improvements.py
          sudo -u djgabo-cdg /opt/djgabo-cdg-ia-test/.venv/bin/python -m py_compile \
            /opt/djgabo-cdg-ia-test/server.py \
            /opt/djgabo-cdg-ia-test/renderer/normalize.py \
            /opt/djgabo-cdg-ia-test/renderer/render.py

          sudo systemctl restart djgabo-cdg-ia-test
          ok=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8775/healthz >/tmp/ia-health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo "TEST_HEALTH=OK"
          qr_vendor_code=$(curl -sS -o /tmp/jsQR-served.js -w '%{http_code}' http://127.0.0.1:8775/vendor/jsQR.js)
          test "$qr_vendor_code" = "200"
          grep -q 'webpackUniversalModuleDefinition' /tmp/jsQR-served.js
          echo "QR_VENDOR_HTTP=$qr_vendor_code"

          echo "=== REBUILD CURRENT IA TEST FROM FULL SCRIBE ==="
          cd /opt/djgabo-cdg-ia-test
          sudo -u djgabo-cdg env \
            HOME=/var/lib/djgabo-cdg-ia-test \
            DJGABO_ENV=test DJGABO_TEST_MODE=1 DJGABO_URL_PREFIX=/cdg-editor-ia \
            DJGABO_DATA_DIR=/var/lib/djgabo-cdg-ia-test \
            DJGABO_CONFIG_DIR=/var/lib/djgabo-cdg-ia-test/config \
            DJGABO_DB_PATH=/var/lib/djgabo-cdg-ia-test/local.db \
            DJGABO_JOBS_DIR=/var/lib/djgabo-cdg-ia-test/jobs \
            DJGABO_OUTPUT_DIR=/var/lib/djgabo-cdg-ia-test/output \
            DJGABO_VOICE_CACHE_DIR=/var/lib/djgabo-cdg-ia-test/voice_cache \
            DJGABO_SKIP_PREV_MIGRATION=1 \
            /opt/djgabo-cdg-ia-test/.venv/bin/python - <<'PY'
          import json, time, sqlite3, requests
          from pathlib import Path
          import server

          with server.db() as c:
              r=c.execute("select * from jobs where origin='IA_TEST' order by updated desc limit 1").fetchone()
              if not r: raise SystemExit('NO_IA_TEST_JOB')
              row=dict(r)
          jid=row['id']
          jobdir=Path(server.JOBS)/jid
          stamp=time.strftime('%Y%m%d-%H%M%S')
          old_project=row.get('project_json') or '{}'
          (jobdir/f'backup_pre_7_improvements_{stamp}.json').write_text(old_project,encoding='utf-8')
          (jobdir/f'backup_pre_7_improvements_{stamp}.txt').write_text(str(row.get('lyrics_corrected') or ''),encoding='utf-8')

          voice=jobdir/row['voice_filename']
          started=time.monotonic()
          with voice.open('rb') as fh:
              rr=requests.post('http://127.0.0.1:8097/api/elevenlabs/transcribe',
                  files={'audio':(voice.name,fh,'audio/mpeg')},
                  data={'lyrics':'','language_code':'spa'},timeout=(30,1200))
          rr.raise_for_status()
          payload=rr.json(); words=payload.get('words') or []
          if not words: raise SystemExit('SCRIBE_RETURNED_NO_WORDS')

          project=server._ai_project_from_words(
              row['artist'],row['title'],row['voice_filename'],row.get('duration') or 0,
              '',words,'scribe_only',jid=jid)
          gaps=server._detect_untranscribed_voice(voice,words,row.get('duration') or 0)
          project.setdefault('ai',{})['voice_gaps']=gaps
          project['ai']['scribe_word_count']=len(words)
          project['ai']['coverage_check']='audio_energy_vs_scribe'
          final_lyrics=server._project_lyrics(project)
          total=sum(len(s.get('words',[])) for s in project.get('segments',[]))
          timed=sum(1 for s in project.get('segments',[]) for w in s.get('words',[]) if w.get('start_time') is not None)

          with server.db() as c:
              c.execute("update jobs set project_json=?,lyrics_corrected=?,lyrics_moises=?,updated=? where id=?",
                  (json.dumps(project,ensure_ascii=False),final_lyrics,final_lyrics,server.now(),jid))
              server.log(c,jid,'SCRIBE V2 · RECONSTRUIR COMPLETO 7 MEJORAS','scribe_only')
          (jobdir/'letra_moises.txt').write_text(final_lyrics,encoding='utf-8')

          print('JOB='+jid)
          print('SCRIBE_WORDS='+str(len(words)))
          print('PROJECT_WORDS='+str(total))
          print('TIMED_WORDS='+str(timed))
          print('VOICE_GAPS='+str(len(gaps)))
          for g in gaps:
              print('VOICE_GAP='+json.dumps(g,ensure_ascii=False))
          print('ELAPSED='+str(round(time.monotonic()-started,3)))
          assert total==len(words), (total,len(words))
          assert timed==total, (timed,total)
          assert project.get('ai',{}).get('source_mode')=='scribe_only'
          PY

          echo "=== CENTERING TEST ==="
          sudo -u djgabo-cdg /opt/djgabo-cdg-ia-test/.venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0,'/opt/djgabo-cdg-ia-test/renderer')
          import normalize as N
          a=[[{'text':'a'}],[{'text':'b'}],[{'text':'c'}],[{'text':'d'}],[],[{'text':'e'}],[{'text':'f'}]]
          out=N.center_stanza_pages(a,6)
          pos=[i%6 for i,line in enumerate(out) if line and line[0]['text'] in ('e','f')]
          print('SECOND_STANZA_ROWS='+str(pos))
          assert pos==[2,3],pos
          PY

          echo "=== FRONTEND MARKERS ==="
          curl -fsS http://127.0.0.1:8775/ > /tmp/ia-panel.html
          curl -fsS 'http://127.0.0.1:8775/editor-v1?embed=1' > /tmp/ia-editor.html
          grep -q 'iaProgressFill' /tmp/ia-panel.html
          grep -q 'create-job/start' /tmp/ia-panel.html
          grep -q 'aiQaBar' /tmp/ia-editor.html
          grep -q 'VOZ SIN TEXTO' /tmp/ia-editor.html
          grep -q 'function pvWrap' /tmp/ia-editor.html
          echo "FRONTEND_7=OK"

          echo "ASYNC_START_ROUTE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8775/api/ai/create-job/start)"
          echo "ASYNC_STATUS_ROUTE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8775/api/ai/tasks/fake)"
          echo "TEST_AFTER=$(sudo systemctl is-active djgabo-cdg-ia-test)"
          echo "PRODUCTION_AFTER=$(sudo systemctl is-active djgabo-cdg)"
          echo "PRODUCTION_HTTP=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)"
          REMOTE

      - name: Verify public route
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://panel.kitkaraoke.com/cdg-editor-ia/ || true)"
          echo "PUBLIC_HTTP=$code" | tee -a diagnostics/cdg-editor-ia-7-improvements.txt
          case "$code" in 200|301|302|303|307|308) ;; *) exit 1 ;; esac

      - name: Save report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-editor-ia-7-improvements.txt ]; then
            git add diagnostics/cdg-editor-ia-7-improvements.txt
            git commit -m "diag: verify seven CDG IA improvements" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
