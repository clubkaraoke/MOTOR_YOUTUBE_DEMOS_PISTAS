name: One-time KITKARAOKE OVH quick diagnostic V3

on:
  push:
    branches:
      - diag-kitkaraoke-state
    paths:
      - '.github/workflows/diag-kitkaraoke-state-v3.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure OVH SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect quick state
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > OVH_KITKARAOKE_DIAG_V3.txt <<'REMOTE'
          set +e
          ROOT=/opt/KITKARAOKE_DATA_SYNC
          UNIT=kitkaraoke-ingles-migration-005-035
          echo "=== KTV OVH QUICK DIAG V3 ==="
          date -Is
          cd "$ROOT" || { echo "ROOT_MISSING"; exit 0; }

          echo
          echo "=== SAFE ENV ==="
          python3 - <<'PY'
from pathlib import Path
p=Path('/opt/KITKARAOKE_DATA_SYNC/.env')
safe={'DATASET_KEY','SOURCE_PATH','DEST_PATH','BLOCK_PREFIX','BLOCK_SIZE','DRY_RUN','AUTO_SYNC','MIN_EXPECTED_SOURCE_COUNT','COPY_WORKERS','SYNC_INTERVAL_SECONDS','DATA_DIR'}
if not p.exists():
    print('.env MISSING')
else:
    found=0
    for raw in p.read_text(errors='replace').splitlines():
        line=raw.strip()
        if not line or line.startswith('#') or '=' not in line:
            continue
        k,v=line.split('=',1)
        k=k.strip()
        if k.startswith('export '): k=k[7:].strip()
        if k in safe:
            print(f'{k}={v.strip()}')
            found+=1
    print('SAFE_KEYS_FOUND=',found)
PY

          echo
          echo "=== MIGRATION STATE FILE ==="
          [ -f data/migracion_ingles_estado.json ] && cat data/migracion_ingles_estado.json || echo MISSING

          echo
          echo "=== SYSTEMD UNIT ==="
          sudo systemctl is-active "$UNIT" 2>&1
          sudo systemctl is-failed "$UNIT" 2>&1
          sudo systemctl --no-pager --full status "$UNIT" 2>&1 | tail -n 35

          echo
          echo "=== MIGRATION JOURNAL TAIL ==="
          sudo journalctl -u "$UNIT" -n 80 --no-pager 2>&1

          echo
          echo "=== DATA FILES ==="
          find data -maxdepth 2 -type f -printf '%p | %s bytes | %TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null | sort

          echo
          echo "=== DOCKER ==="
          sudo docker compose ps 2>&1
          sudo docker inspect kitkaraoke-data-sync --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}' 2>&1

          echo
          echo "=== RELEVANT PROCESSES ==="
          ps -eo pid,etime,cmd | grep -E 'migrate_ingles_remaining|copy_block|rclone' | grep -v grep

          echo
          echo "=== HOST ==="
          df -h / | tail -n 1
          free -h | sed -n '1,2p'
          echo "=== END ==="
          REMOTE

      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OVH_KITKARAOKE_DIAG_V3.txt
          git commit -m "diag: capture quick live KITKARAOKE OVH state V3"
          git push origin HEAD:diag-kitkaraoke-state
