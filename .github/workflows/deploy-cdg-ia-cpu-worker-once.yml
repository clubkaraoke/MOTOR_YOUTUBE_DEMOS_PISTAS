name: Deploy CDG IA CPU worker once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cdg-ia-cpu-worker-once.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostics repo
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Deploy and warm CPU worker
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-cpu-worker-deploy.txt <<'REMOTE'
          set -euo pipefail
          TARGET=/opt/cdg-ia-sync-test
          STAGE=/tmp/cdg-ia-sync-test-main
          ARCHIVE=/tmp/cdg-ia-sync-test-main.tar.gz

          echo "TIMESTAMP=$(date -Is)"
          echo
          echo "=== BEFORE ==="
          df -h /
          free -h
          sudo du -sh /data/cdg-ai-models 2>/dev/null || true
          sudo docker system df

          rm -rf "$STAGE" "$ARCHIVE"
          mkdir -p "$STAGE"
          curl -fL --retry 3 -o "$ARCHIVE" https://github.com/clubkaraoke/CDG_IA_SYNC_TEST/archive/refs/heads/main.tar.gz
          tar -xzf "$ARCHIVE" -C "$STAGE" --strip-components=1

          sudo install -d -m 755 "$TARGET"
          sudo install -d -m 700 "$TARGET/runtime"
          sudo install -d -m 755 /data/cdg-ai-models
          sudo rsync -a --delete \
            --exclude='.env' \
            --exclude='/runtime/' \
            "$STAGE/" "$TARGET/"

          cd "$TARGET"
          echo
          echo "=== BUILD WORKER ==="
          sudo docker compose -p cdg-ia-sync-test up -d --build cdg-ai-sync-cpu cdg-ia-sync-test

          echo
          echo "=== HEALTH BEFORE MODELS ==="
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8098/health >/tmp/cpu-health.json; then break; fi
            sleep 2
          done
          cat /tmp/cpu-health.json
          echo
          sudo docker inspect cdg-ai-sync-cpu --format 'memory_limit={{.HostConfig.Memory}} nano_cpus={{.HostConfig.NanoCpus}}'
          sudo docker stats --no-stream cdg-ai-sync-cpu --format 'ram={{.MemUsage}} cpu={{.CPUPerc}}'

          echo
          echo "=== WARMUP MODELS ==="
          /usr/bin/time -v curl -fsS -X POST --max-time 1200 http://127.0.0.1:8098/warmup -o /tmp/cpu-warmup.json 2>/tmp/cpu-warmup-time.txt
          cat /tmp/cpu-warmup.json
          echo
          cat /tmp/cpu-warmup-time.txt

          echo
          echo "=== AFTER WARMUP ==="
          df -h /
          free -h
          sudo du -sh /data/cdg-ai-models
          sudo du -h --max-depth=2 /data/cdg-ai-models | sort -h | tail -30
          sudo docker stats --no-stream cdg-ai-sync-cpu --format 'ram={{.MemUsage}} cpu={{.CPUPerc}}'
          sudo docker system df
          echo
          echo "=== SERVICES ==="
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep -E 'cdg-ai-sync-cpu|cdg-ia-sync-test' || true

          rm -rf "$STAGE" "$ARCHIVE"
          REMOTE

      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-ia-cpu-worker-deploy.txt
          git commit -m "diag: record CDG IA CPU worker deploy" || exit 0
          git push origin HEAD:main
