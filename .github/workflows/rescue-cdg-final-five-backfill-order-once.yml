name: Rescue CDG final five backfill order once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rescue-cdg-final-five-backfill-order-once.yml"

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Rescue live service
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          scp -P "$OVH_PORT" deploy/cdg_final_five_v1/rescue_backfill_order.py "$OVH_USER@$OVH_HOST:/tmp/rescue_backfill_order.py"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          P=/opt/djgabo-cdg
          sudo python3 /tmp/rescue_backfill_order.py "$P/server.py"
          sudo python3 -m py_compile "$P/server.py"
          sudo systemctl restart djgabo-cdg
          sleep 2
          echo "SERVICE=$(sudo systemctl is-active djgabo-cdg)"
          test "$(sudo systemctl is-active djgabo-cdg)" = active
          echo "HTTP=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/editor-v1)"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/editor-v1)" = 200
          sudo "$P/.venv/bin/python" - <<'PY'
          import sqlite3
          db=sqlite3.connect("/var/lib/djgabo-cdg/local.db")
          cols={x[1] for x in db.execute("pragma table_info(jobs)")}
          print("FINGERPRINT_COLS="+str({"timings_sha256","cdg_source_sha256"}.issubset(cols)))
          assert {"timings_sha256","cdg_source_sha256"}.issubset(cols)
          r=db.execute("select timings_sha256,cdg_source_sha256 from jobs where id='LET-0095'").fetchone()
          print("LET0095_MASTER_HASH="+("SET" if r and r[0] else "MISSING"))
          print("LET0095_CDG_SOURCE_HASH="+("SET" if r and r[1] else "OLD_OR_UNKNOWN"))
          assert r and r[0]
          PY
          echo "RESCUE=OK"
          REMOTE

# rerun after rescue script newline fix
