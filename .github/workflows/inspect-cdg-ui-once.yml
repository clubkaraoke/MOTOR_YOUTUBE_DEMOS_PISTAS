name: Inspect CDG UI source once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-ui-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect service on port 8765
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== LISTENER 8765 ==="
          sudo ss -ltnp | grep ':8765' || true

          echo "=== GUNICORN PROCESS ==="
          pid="$(sudo ss -ltnp | awk '/:8765/ && /gunicorn/ {match($0,/pid=[0-9]+/); if (RSTART) {print substr($0,RSTART+4,RLENGTH-4); exit}}')"
          echo "PID=$pid"
          if [ -n "$pid" ]; then
            cwd="$(sudo readlink -f "/proc/$pid/cwd")"
            echo "CWD=$cwd"
            echo -n "CMD="
            sudo tr '\0' ' ' < "/proc/$pid/cmdline"
            echo
            echo "=== SOURCE FILES ==="
            sudo find "$cwd" -maxdepth 3 -type f \( -name "*.py" -o -name "*.html" -o -name "*.css" -o -name "*.js" \) -printf '%p\n' | sort | head -n 160
            echo "=== UI STRING MATCHES HOST ==="
            sudo grep -RIl -E "LETRA LIBRE|Comenzar corrección|Siguiente trabajo recomendado|Pantalla|Ajustes" "$cwd" 2>/dev/null | head -n 50 || true
            echo "=== EDITOR V1 STRUCTURE ==="
            sudo grep -n -E "@media|max-width|viewport|layout|workspace|wave|lyric|lyrics|letra|pane|panel|tab|Pantalla|Ajustes|mobile" "$cwd/editor_v1/index.html" | head -n 360 || true
            echo "=== EDITOR V1 CSS 1-520 ==="
            sudo sed -n '1,520p' "$cwd/editor_v1/index.html"
            echo "=== EDITOR V1 HTML 520-900 ==="
            sudo sed -n '520,900p' "$cwd/editor_v1/index.html"
          fi

          echo "=== DOCKER PORTS ==="
          sudo docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}' | grep -E '8765|cdg|consol|editor' || true

          cid="$(sudo docker ps -q --filter publish=8765 | head -n1)"
          if [ -n "$cid" ]; then
            echo "=== CONTAINER ==="
            sudo docker inspect "$cid" --format 'NAME={{.Name}} IMAGE={{.Config.Image}} WORKDIR={{.Config.WorkingDir}}'
            echo "=== MOUNTS ==="
            sudo docker inspect "$cid" --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
            echo "=== ROOT CANDIDATES ==="
            sudo docker exec "$cid" sh -lc 'pwd; find /app /srv /usr/share/nginx/html -maxdepth 3 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.py" \) 2>/dev/null | head -n 120'
            echo "=== UI STRING MATCHES ==="
            sudo docker exec "$cid" sh -lc 'grep -RIl -E "LETRA LIBRE|Comenzar corrección|Siguiente trabajo recomendado|Pantalla.*Letra.*Ajustes" /app /srv /usr/share/nginx/html 2>/dev/null | head -n 40' || true
          fi

          echo "=== LOCAL HTML HEAD ==="
          curl -fsS http://127.0.0.1:8765/ | head -n 80 || true
          REMOTE
