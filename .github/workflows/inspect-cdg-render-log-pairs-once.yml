name: Inspect CDG render log pairs once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-render-log-pairs-once.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read render logs
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'sudo /opt/djgabo-cdg/.venv/bin/python -' <<'PY'
          import sqlite3,json,base64
          db=sqlite3.connect("/var/lib/djgabo-cdg/local.db");db.row_factory=sqlite3.Row
          jobs={r["id"]:(r["artist"],r["title"]) for r in db.execute("select id,artist,title from jobs")}
          out=[]
          for r in db.execute("select id,job_id,action,state,at from logs order by id desc limit 1500"):
              d=dict(r)
              s=str(d.get("at") or "")
              if s.startswith("04/09/2026") or s.startswith("05/09/2026"):
                  a,t=jobs.get(d.get("job_id"),("",""))
                  d["artist"]=a;d["title"]=t;out.append(d)
          out.reverse()
          print("B64="+base64.b64encode(json.dumps(out,ensure_ascii=False,separators=(",",":")).encode()).decode())
          PY
