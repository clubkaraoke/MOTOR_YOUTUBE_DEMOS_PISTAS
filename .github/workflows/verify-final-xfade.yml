name: Check retried xfade jobs

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" "$OVH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
      - name: Check production statuses
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          python3 - <<'PY'
          import json, urllib.request
          jobs=json.load(urllib.request.urlopen('http://127.0.0.1:8088/api/jobs'))
          artists={'Lourdes Huanchaca','Celinda Vargas y La Banda Top','Zaperoko','Masiel Malaga','Gaby Zambrano'}
          for j in jobs:
              if j.get('artist') in artists and not j.get('published_at'):
                  msg=(j.get('error_message') or '').replace('\n',' ')[:180]
                  print(j.get('artist'),'|',j.get('title'),'|',j.get('status'),'|',j.get('progress'),'|',j.get('error_code') or '', '|', msg)
          PY
          REMOTE
