name: Recover YouTube upload queue

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"

      - name: Verify OAuth and requeue recoverable uploads
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/djgabo-youtube
          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          from sqlalchemy import select
          from app.api.main import enqueue, queue
          from app.core.database import SessionLocal
          from app.models.entities import Channel, Job, JobStatus
          from app.services.youtube import _service

          expected = {
              1: "Pistas Musicales El Club",
              2: "DJ ZETA",
              3: "Pistas Musicales GO!",
              4: "DJMABEX - Ediciones a pedido",
          }

          with SessionLocal() as db:
              channels = db.scalars(select(Channel).order_by(Channel.id)).all()
              verified = True
              for channel in channels:
                  try:
                      response = _service(channel).channels().list(part="id,snippet", mine=True).execute()
                      items = response.get("items", [])
                      title = items[0].get("snippet", {}).get("title") if items else None
                      match = bool(title and title.strip() == expected.get(channel.id, "").strip())
                      print("CHANNEL", channel.id, channel.display_name, "OK" if match else "MISMATCH", title)
                      verified = verified and match
                  except Exception as exc:
                      print("CHANNEL", channel.id, channel.display_name, "ERROR", type(exc).__name__, str(exc)[:240])
                      verified = False

              if not verified:
                  raise SystemExit("OAuth/channel verification failed; recovery aborted")

              candidates = db.scalars(
                  select(Job).where(
                      Job.status == JobStatus.UPLOAD_ERROR.value,
                      Job.youtube_video_id.is_(None),
                      Job.error_code == "YOUTUBE_OAUTH_RECONNECT_REQUIRED",
                  ).order_by(Job.created_at)
              ).all()

              print("RECOVERY_CANDIDATES", len(candidates))
              if not candidates:
                  raise SystemExit("No recoverable OAuth upload jobs found")

              ids = [job.id for job in candidates]
              for job in candidates:
                  # Let the scheduler choose a fresh channel so the 7-per-24h rule
                  # is respected as each recovery publication succeeds.
                  queue.connection.delete(f"djgabo:enqueued:{job.id}")
                  job.previous_status = JobStatus.UPLOAD_ERROR.value
                  job.status = JobStatus.QUEUED.value
                  job.progress = 0
                  job.error_code = None
                  job.error_message = None
              db.commit()

              enqueued = 0
              for job_id in ids:
                  if enqueue(job_id):
                      enqueued += 1
              print("RECOVERY_ENQUEUED", enqueued)
              print("RECOVERY_IDS", ",".join(x[:8] for x in ids))
          PY

          sleep 25

          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          from sqlalchemy import func, select
          from app.core.database import SessionLocal
          from app.models.entities import Job

          with SessionLocal() as db:
              counts = db.execute(
                  select(Job.status, func.count(Job.id)).group_by(Job.status).order_by(Job.status)
              ).all()
              print("POST_RECOVERY_STATUS_COUNTS", {status: count for status, count in counts})
              active = db.scalars(
                  select(Job).where(
                      Job.youtube_video_id.is_(None),
                      Job.status.in_(["QUEUED","DOWNLOADING_AUDIO","RENDERING","VALIDATING","MP4_READY","WAITING_SLOT","UPLOADING_YOUTUBE","VERIFYING","UPLOAD_ERROR"])
                  ).order_by(Job.updated_at.desc()).limit(12)
              ).all()
              for job in active:
                  print("ACTIVE", job.id[:8], job.status, "progress="+str(job.progress), "channel="+str(job.channel_id), "error="+str(job.error_code))
          PY

          sudo docker compose -f docker-compose.prod.yml exec -T redis redis-cli LLEN rq:queue:djgabo
          REMOTE
