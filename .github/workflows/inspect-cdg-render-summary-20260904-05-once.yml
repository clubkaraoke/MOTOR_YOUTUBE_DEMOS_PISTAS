name: Inspect CDG render summary 2026-09-04 05 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-render-summary-20260904-05-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production render history read-only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'sudo /opt/djgabo-cdg/.venv/bin/python -' <<'PY'
          import sqlite3,json,time,base64
          from pathlib import Path
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo

          LIMA=ZoneInfo("America/Lima"); UTC=timezone.utc
          start=datetime(2026,9,4,0,0,tzinfo=LIMA).timestamp()
          end=datetime(2026,9,6,0,0,tzinfo=LIMA).timestamp()
          db=sqlite3.connect("/var/lib/djgabo-cdg/local.db"); db.row_factory=sqlite3.Row

          def parse(v):
              if v is None: return None
              if isinstance(v,(int,float)):
                  x=float(v); return x/1000 if x>1e11 else x
              s=str(v).strip()
              for f in ("%d/%m/%Y %H:%M:%S","%d/%m/%Y %H:%M","%Y-%m-%d %H:%M:%S","%Y-%m-%dT%H:%M:%S"):
                  try: return datetime.strptime(s,f).replace(tzinfo=UTC).timestamp()
                  except: pass
              try:
                  d=datetime.fromisoformat(s.replace("Z","+00:00"))
                  if d.tzinfo is None: d=d.replace(tzinfo=UTC)
                  return d.timestamp()
              except: return None
          def lima(ep): return datetime.fromtimestamp(ep,LIMA).isoformat() if ep else None

          jobs={}
          for r in db.execute("select * from jobs"):
              d=dict(r); jobs[str(d.get("id"))]=d

          logs=[]
          for r in db.execute("select * from logs order by id"):
              d=dict(r); a=parse(d.get("at"))
              if a and start<=a<end:
                  d["at_epoch"]=a; d["at_lima"]=lima(a); logs.append(d)

          cache=[]
          p=Path("/var/lib/djgabo-cdg/preview_cache_cdg")
          if p.exists():
              for f in p.glob("*.cdg"):
                  st=f.stat()
                  if start<=st.st_mtime<end:
                      j=jobs.get(f.stem,{})
                      cache.append({
                        "job_id":f.stem,"artist":j.get("artist"),"title":j.get("title"),
                        "mtime_epoch":st.st_mtime,"mtime_lima":lima(st.st_mtime),
                        "size":st.st_size,"song_duration":j.get("duration"),
                        "render_status":j.get("render_status"),"updated":j.get("updated"),
                        "status":j.get("status")
                      })
          cache.sort(key=lambda x:x["mtime_epoch"])

          recent_jobs=[]
          for d in jobs.values():
              u=parse(d.get("updated"))
              if u and start<=u<end:
                  recent_jobs.append({k:d.get(k) for k in ["id","artist","title","status","render_status","render_progress","render_error","updated","duration","cdg_local_filename","cdg_dropbox_path"]})
          report={"server_now_utc":datetime.now(UTC).isoformat(),"logs":logs,"cache":cache,"recent_jobs":recent_jobs}
          raw=json.dumps(report,ensure_ascii=False,separators=(",",":"),default=str).encode()
          print("REPORT_B64="+base64.b64encode(raw).decode())
          PY
