name: Fix CDG IA BASE v2 inference tensor once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cdg-ia-base-v2-inference-tensor-once.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Deploy worker fix and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-base-v2-inference-fix.txt <<'REMOTE'
          set -euo pipefail
          TARGET=/opt/cdg-ia-sync-test
          STAGE=/tmp/cdg-ia-sync-test-inference-fix
          ARCHIVE=/tmp/cdg-ia-sync-test-inference-fix.tar.gz

          echo "TIMESTAMP=$(date -Is)"
          echo "=== BEFORE ==="
          sudo docker stats --no-stream cdg-ai-sync-cpu --format 'name={{.Name}} mem={{.MemUsage}} cpu={{.CPUPerc}}'

          rm -rf "$STAGE" "$ARCHIVE"
          mkdir -p "$STAGE"
          curl -fL --retry 3 -o "$ARCHIVE" https://github.com/clubkaraoke/CDG_IA_SYNC_TEST/archive/refs/heads/main.tar.gz
          tar -xzf "$ARCHIVE" -C "$STAGE" --strip-components=1

          python3 -m py_compile "$STAGE/cpu_worker/app.py"
          grep -q 'log_probs = log_probs.clone()' "$STAGE/cpu_worker/app.py"

          sudo rsync -a --delete \
            --exclude='.env' \
            --exclude='/runtime/' \
            "$STAGE/" "$TARGET/"

          cd "$TARGET"
          sudo docker compose -p cdg-ia-sync-test build cdg-ai-sync-cpu
          sudo docker compose -p cdg-ia-sync-test up -d --no-deps cdg-ai-sync-cpu

          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8098/health >/tmp/worker-health.json; then
              ok=1
              break
            fi
            sleep 2
          done
          [ "$ok" = 1 ]
          cat /tmp/worker-health.json
          echo
          grep -q 'whisperx-style-local-base-v2' /tmp/worker-health.json

          echo "=== PYTORCH INFERENCE TENSOR REGRESSION ==="
          sudo docker exec -i cdg-ai-sync-cpu python - <<'PY'
          import torch
          with torch.inference_mode():
              x = torch.randn(1, 8, 4)
              y = torch.log_softmax(x, dim=-1)
          y = y.clone()
          y[:, :, 1:] -= 1.0
          print("INFERENCE_TENSOR_CLONE_TEST=PASS", y.shape)
          PY

          echo "=== ALIGN_LINE REGRESSION ==="
          sudo docker exec -i cdg-ai-sync-cpu python - <<'PY'
          import torch
          from app import (
              load_alignment_resources, align_line,
              build_rms_activity, split_master
          )
          lines, master = split_master("HOLA")
          sr = 16000
          t = torch.arange(sr * 2, dtype=torch.float32) / sr
          waveform = (0.15 * torch.sin(2 * torch.pi * 220 * t)).unsqueeze(0)
          states, hop, meta = build_rms_activity(waveform, sr)
          res = load_alignment_resources()
          out, warnings = align_line(
              res, waveform, {"start":0.0,"end":2.0},
              lines[0], master,
              vocal_states=states, vocal_hop_s=hop
          )
          print("ALIGN_LINE_RESULT", out)
          print("ALIGN_LINE_WARNINGS", warnings)
          print("ALIGN_LINE_REGRESSION=PASS")
          PY

          echo "=== AFTER ==="
          sudo docker ps --filter name=cdg-ai-sync-cpu --format 'name={{.Names}} status={{.Status}}'
          sudo docker stats --no-stream cdg-ai-sync-cpu --format 'name={{.Name}} mem={{.MemUsage}} cpu={{.CPUPerc}}'
          free -h

          rm -rf "$STAGE" "$ARCHIVE"
          REMOTE

      - name: Commit result
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-ia-base-v2-inference-fix.txt ]; then
            git add diagnostics/cdg-ia-base-v2-inference-fix.txt
            git commit -m "diag: verify BASE v2 inference tensor fix" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
