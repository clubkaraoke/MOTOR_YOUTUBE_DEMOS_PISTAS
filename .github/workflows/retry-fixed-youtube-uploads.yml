name: Retry fixed YouTube uploads

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"

      - name: Retry only HTTP 308 failures
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/djgabo-youtube
          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          import inspect
          from sqlalchemy import select
          from app.api.main import enqueue, queue
          from app.core.database import SessionLocal
          from app.models.entities import Job, JobStatus
          from app.services import youtube

          source = inspect.getsource(youtube._service)
          if "redirect_codes" not in source or "{308}" not in source:
              raise SystemExit("HTTP 308 fix is not deployed; retry aborted")

          with SessionLocal() as db:
              jobs = db.scalars(
                  select(Job).where(
                      Job.status == JobStatus.UPLOAD_ERROR.value,
                      Job.youtube_video_id.is_(None),
                      Job.error_code == "YOUTUBE_ERROR",
                      Job.error_message.contains("Redirected but the response is missing a Location"),
                  ).order_by(Job.created_at)
              ).all()
              print("HTTP308_RETRY_CANDIDATES", len(jobs))
              ids = [job.id for job in jobs]
              for job in jobs:
                  queue.connection.delete(f"djgabo:enqueued:{job.id}")
                  job.previous_status = JobStatus.UPLOAD_ERROR.value
                  job.status = JobStatus.QUEUED.value
                  job.progress = 0
                  job.error_code = None
                  job.error_message = None
              db.commit()
              enqueued = sum(1 for job_id in ids if enqueue(job_id))
              print("HTTP308_REQUEUED", enqueued)
              print("HTTP308_IDS", ",".join(x[:8] for x in ids))
          PY
          REMOTE
