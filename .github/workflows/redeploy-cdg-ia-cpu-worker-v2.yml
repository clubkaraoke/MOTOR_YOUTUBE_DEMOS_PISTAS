name: Redeploy CDG IA CPU worker v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/redeploy-cdg-ia-cpu-worker-v2.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Redeploy and warm worker
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-cpu-worker-v2.txt <<'REMOTE'
          set -euo pipefail
          TARGET=/opt/cdg-ia-sync-test
          STAGE=/tmp/cdg-ia-sync-test-main
          ARCHIVE=/tmp/cdg-ia-sync-test-main.tar.gz

          echo "TIMESTAMP=$(date -Is)"
          rm -rf "$STAGE" "$ARCHIVE"
          mkdir -p "$STAGE"
          curl -fL --retry 3 -o "$ARCHIVE" https://github.com/clubkaraoke/CDG_IA_SYNC_TEST/archive/refs/heads/main.tar.gz
          tar -xzf "$ARCHIVE" -C "$STAGE" --strip-components=1
          sudo rsync -a --delete --exclude='.env' --exclude='/runtime/' "$STAGE/" "$TARGET/"

          cd "$TARGET"
          echo "=== REBUILD WORKER ==="
          sudo docker compose -p cdg-ia-sync-test up -d --build cdg-ai-sync-cpu

          echo "=== HEALTH ==="
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8098/health >/tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { sudo docker logs --tail 200 cdg-ai-sync-cpu 2>&1; exit 61; }
          cat /tmp/health.json
          echo
          sudo docker inspect cdg-ai-sync-cpu --format 'memory_limit={{.HostConfig.Memory}} nano_cpus={{.HostConfig.NanoCpus}} oom={{.State.OOMKilled}} restart={{.RestartCount}}'
          sudo docker stats --no-stream cdg-ai-sync-cpu --format 'ram={{.MemUsage}} cpu={{.CPUPerc}}'

          echo "=== WARMUP ==="
          set +e
          /usr/bin/time -v curl -fsS -X POST --max-time 1200 http://127.0.0.1:8098/warmup -o /tmp/warmup.json 2>/tmp/warmup.time
          code=$?
          set -e
          echo "warmup_exit=$code"
          [ -f /tmp/warmup.json ] && cat /tmp/warmup.json || true
          echo
          cat /tmp/warmup.time || true
          if [ "$code" -ne 0 ]; then
            echo "=== WORKER LOGS ==="
            sudo docker logs --tail 250 cdg-ai-sync-cpu 2>&1
            exit "$code"
          fi

          echo "=== AFTER ==="
          df -h /
          free -h
          sudo du -sh /data/cdg-ai-models
          sudo du -h --max-depth=3 /data/cdg-ai-models | sort -h | tail -30
          sudo docker stats --no-stream cdg-ai-sync-cpu --format 'ram={{.MemUsage}} cpu={{.CPUPerc}}'
          sudo docker images cdg-ia-sync-test-cdg-ai-sync-cpu --format 'size={{.Size}}'
          sudo docker system df

          rm -rf "$STAGE" "$ARCHIVE"
          REMOTE

      - name: Commit result
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-ia-cpu-worker-v2.txt ]; then
            git add diagnostics/cdg-ia-cpu-worker-v2.txt
            git commit -m "diag: record CPU worker v2" || exit 0
            git push origin HEAD:main
          fi
