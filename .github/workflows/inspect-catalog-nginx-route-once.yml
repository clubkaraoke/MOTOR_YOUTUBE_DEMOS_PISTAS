name: Inspect catalog nginx route once

on:
  push:
    paths:
      - ".github/workflows/inspect-catalog-nginx-route-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -H "$OVH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Inspect route
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== MARKER CONTEXT ==="
          sudo grep -n -B20 -A20 'KITKARAOKE_UNIVERSAL_CATALOG' /etc/nginx/sites-available/djgabo-cdg || true
          echo "=== SERVER NAMES ==="
          sudo grep -n -E 'server_name|listen 443|listen \[::\]:443|location = /catalogo' /etc/nginx/sites-available/djgabo-cdg
          echo "=== FILE ==="
          sudo ls -l /var/www/kitkaraoke-public/03_INGLES.json
          echo "=== LOCAL HOST HEADER ==="
          curl -k -sS -D - https://127.0.0.1/catalogo/03_INGLES.json -H 'Host: panel.kitkaraoke.com' -o /tmp/body || true
          head -c 200 /tmp/body 2>/dev/null || true
          REMOTE
