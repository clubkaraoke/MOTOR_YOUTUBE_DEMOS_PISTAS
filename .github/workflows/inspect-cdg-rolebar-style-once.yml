name: Inspect CDG rolebar style once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-rolebar-style-once.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Inspect live rolebar CSS and markup
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-rolebar-style-live.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          F=/opt/djgabo-cdg-ia-test/editor_v1/index.html
          echo "=== SIN ROL MARKUP ==="
          sudo -u djgabo-cdg grep -n -B8 -A12 "SIN ROL" "$F" | head -80 || true
          echo "=== STICKY CSS ==="
          sudo -u djgabo-cdg grep -n -B4 -A8 -E "position:[[:space:]]*sticky|sticky" "$F" | head -160 || true
          echo "=== PURPLE/BACKGROUND NEAR TOOLBAR ==="
          sudo -u djgabo-cdg grep -n -B4 -A8 -E "role|toolbar|roles|#5|#6|rgba\(" "$F" | head -240 || true
          echo "=== PLAYHI CSS + JS ==="
          sudo -u djgabo-cdg grep -n -B10 -A30 -E "playHi|classList.*playHi|currentTime|start_time|end_time" "$F" | head -520 || true
          echo "=== RENDER FUNCTIONS ==="
          sudo -u djgabo-cdg grep -n -B8 -A40 -E "function renderLyrics|function render.*lyrics|renderLyrics\(|update.*play|requestAnimationFrame|timeupdate" "$F" | head -520 || true
          echo "=== RECENT BACKUPS ==="
          sudo -u djgabo-cdg find /opt/djgabo-cdg-ia-test/editor_v1 -maxdepth 1 -type f -name 'index.html.bak*' -printf '%TY-%Tm-%Td %TH:%TM:%TS %f\n' | sort -r | head -20
          REMOTE

      - name: Save diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-rolebar-style-live.txt
          git commit -m "diag: inspect rolebar style live" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
