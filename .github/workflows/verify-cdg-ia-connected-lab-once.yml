name: Verify CDG IA connected LAB once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cdg-ia-connected-lab-once.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Verify live LAB
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== UI ==="
          curl -fsS http://127.0.0.1:8097/ | grep -E 'Sincronizar con IA|syncBtn' | head -5

          echo "=== WEB -> WORKER ==="
          curl -fsS http://127.0.0.1:8097/api/local/health
          echo

          echo "=== DIRECT WORKER ==="
          curl -fsS http://127.0.0.1:8098/health
          echo

          echo "=== CONTAINERS ==="
          sudo docker ps --filter name=cdg-ia-sync-test --filter name=cdg-ai-sync-cpu --format 'name={{.Names}} status={{.Status}} image={{.Image}}'
          sudo docker stats --no-stream cdg-ia-sync-test cdg-ai-sync-cpu --format 'name={{.Name}} ram={{.MemUsage}} cpu={{.CPUPerc}}'

          echo "=== RESOURCES ==="
          df -h /
          free -h
          sudo du -sh /data/cdg-ai-models
          REMOTE
