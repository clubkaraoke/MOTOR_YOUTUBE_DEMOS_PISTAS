name: Patch OVH universal INGLES catalog once

on:
  push:
    paths:
      - ".github/workflows/patch-ovh-universal-ingles-catalog-once.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -H "$OVH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload patch files
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p patch/app patch/deploy
          printf '%s' '' | base64 -d > patch/app/api.py
          printf '%s' '' | base64 -d > patch/app/cli.py
          printf '%s' '' | base64 -d > patch/app/universal_catalog.py
          printf '%s' '' | base64 -d > patch/deploy/publish_catalog_nginx.py
          printf '%s' '' | base64 -d > patch/deploy/publish_universal_catalog.sh
          scp -P "$OVH_PORT" -r patch "$OVH_USER@$OVH_HOST:/tmp/kitkaraoke-universal-patch"

      - name: Apply patch and publish catalog
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/opt/KITKARAOKE_DATA_SYNC
          PATCH=/tmp/kitkaraoke-universal-patch
          sudo tar -czf "$APP/backup-before-universal-catalog.tgz" -C "$APP" app deploy docker-compose.yml Dockerfile requirements.txt
          sudo install -m 0644 "$PATCH/app/api.py" "$APP/app/api.py"
          sudo install -m 0644 "$PATCH/app/cli.py" "$APP/app/cli.py"
          sudo install -m 0644 "$PATCH/app/universal_catalog.py" "$APP/app/universal_catalog.py"
          sudo install -m 0755 "$PATCH/deploy/publish_catalog_nginx.py" "$APP/deploy/publish_catalog_nginx.py"
          sudo install -m 0755 "$PATCH/deploy/publish_universal_catalog.sh" "$APP/deploy/publish_universal_catalog.sh"
          rm -rf "$PATCH"
          cd "$APP"
          sudo docker compose config --quiet
          sudo docker compose up -d --build kitkaraoke-data-sync
          curl --fail --silent --show-error --retry 15 --retry-delay 2 http://127.0.0.1:8091/health
          sudo bash "$APP/deploy/publish_universal_catalog.sh"
          REMOTE

      - name: Verify public JSON
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://panel.kitkaraoke.com/catalogo/03_INGLES.json -o catalog.json
          python3 -c 'import json; d=json.load(open("catalog.json",encoding="utf-8")); print("count=",d.get("count"),"blocks=",d.get("blocks")); assert d.get("count")==4534; assert d.get("blocks")==35; assert all(x.get("driveFileId") for x in d.get("items",[]))'
