name: Deploy CDG Opening Ending downloads yellow v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cdg-opening-ending-downloads-yellow-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Stage patches from live OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" \
            deploy/cdg_power_yellow_v1/patch_production.py \
            deploy/cdg_opening_ending_controls_v1/patch_production.py \
            deploy/cdg_downloads_v1/patch_routes.py \
            deploy/cdg_downloads_v1/patch_final_js.py \
            "$OVH_USER@$OVH_HOST:/tmp/"

          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PROD=/opt/djgabo-cdg
          STAGE=/tmp/djgabo-opening-ending-downloads-yellow-v1
          sudo rm -rf "$STAGE"
          sudo mkdir -p "$STAGE/renderer/vendor/cdgmaker" "$STAGE/vendor"
          sudo cp "$PROD/editor_v1/index.html" "$STAGE/index.html"
          sudo cp "$PROD/renderer/style.json" "$STAGE/renderer/style.json"
          sudo cp "$PROD/renderer/normalize.py" "$STAGE/renderer/normalize.py"
          sudo cp "$PROD/renderer/vendor/cdgmaker/composer.py" "$STAGE/renderer/vendor/cdgmaker/composer.py"
          sudo cp "$PROD/renderer/vendor/cdgmaker/config.py" "$STAGE/renderer/vendor/cdgmaker/config.py"
          sudo cp "$PROD/cdg_preview_routes.py" "$STAGE/cdg_preview_routes.py"
          sudo cp "$PROD/vendor/cdg-final-preview.js" "$STAGE/vendor/cdg-final-preview.js"
          sudo chmod -R u+rwX,go+rX "$STAGE"

          sudo python3 /tmp/patch_production.py "$STAGE/index.html" "$STAGE/renderer/style.json"
          sudo python3 /tmp/patch_production.py "$STAGE/index.html" "$STAGE/renderer/normalize.py" "$STAGE/renderer/vendor/cdgmaker/composer.py" "$STAGE/renderer/vendor/cdgmaker/config.py"
          sudo python3 /tmp/patch_routes.py "$STAGE/cdg_preview_routes.py"
          sudo python3 /tmp/patch_final_js.py "$STAGE/vendor/cdg-final-preview.js"

          sudo python3 -m py_compile "$STAGE/renderer/normalize.py" "$STAGE/renderer/vendor/cdgmaker/composer.py" "$STAGE/renderer/vendor/cdgmaker/config.py" "$STAGE/cdg_preview_routes.py"

          sudo env STAGE="$STAGE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["STAGE"])
          h=(root/"index.html").read_text(encoding="utf-8")
          js=(root/"vendor/cdg-final-preview.js").read_text(encoding="utf-8")
          routes=(root/"cdg_preview_routes.py").read_text(encoding="utf-8")
          norm=(root/"renderer/normalize.py").read_text(encoding="utf-8")
          comp=(root/"renderer/vendor/cdgmaker/composer.py").read_text(encoding="utf-8")
          cfg=(root/"renderer/vendor/cdgmaker/config.py").read_text(encoding="utf-8")
          style=json.load(open(root/"renderer/style.json",encoding="utf-8"))
          checks={
            "EDITOR_CONTROLS":"DJGABO_OPENING_ENDING_CONTROLS_V1" in h,
            "OPENING_PREVIEW":'id="pvOpeningPreviewEnabled"' in h,
            "OPENING_CDG":'id="pvOpeningCdgEnabled"' in h,
            "ENDING_PREVIEW":'id="pvEndingPreviewEnabled"' in h,
            "ENDING_CDG":'id="pvEndingCdgEnabled"' in h,
            "PROJECT_FLAGS":"opening_preview_enabled" in h and "ending_cdg_enabled" in h,
            "PREVIEW_YELLOW":'"#FFFF00"' in h,
            "STYLE_YELLOW":style.get("highlight_default")=="#FFFF00" and style.get("highlight_color")=="#FFFF00",
            "NORMALIZE_ENDING":"DJGABO_ENDING_ENABLE_NORMALIZER_V1" in norm,
            "COMPOSER_ENDING":"DJGABO_ENDING_ENABLE_COMPOSER_V1" in comp,
            "CONFIG_ENDING":"DJGABO_ENDING_ENABLE_CONFIG_V1" in cfg,
            "DOWNLOAD_ROUTES":"DJGABO_CDG_DOWNLOADS_V1" in routes and "/download/zip" in routes,
            "DOWNLOAD_UI":"DJGABO_CDG_DOWNLOADS_UI_V1" in js and "cdgDownloadZip" in js,
          }
          for k,v in checks.items():
              print(k+"="+("PASS" if v else "FAIL"));assert v,k
          print("STATIC_STAGE=PASS")
          PY
          REMOTE

      - name: Fetch staged JavaScript and syntax check on runner
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cdg-js-check
          scp -P "$OVH_PORT" "$OVH_USER@$OVH_HOST:/tmp/djgabo-opening-ending-downloads-yellow-v1/index.html" /tmp/cdg-js-check/index.html
          scp -P "$OVH_PORT" "$OVH_USER@$OVH_HOST:/tmp/djgabo-opening-ending-downloads-yellow-v1/vendor/cdg-final-preview.js" /tmp/cdg-js-check/cdg-final-preview.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path("/tmp/cdg-js-check/index.html").read_text(encoding="utf-8")
          scripts="\n".join(re.findall(r"<script[^>]*>(.*?)</script>",h,re.S|re.I))
          Path("/tmp/cdg-js-check/editor-scripts.js").write_text(scripts,encoding="utf-8")
          PY
          node --check /tmp/cdg-js-check/editor-scripts.js
          node --check /tmp/cdg-js-check/cdg-final-preview.js
          echo "JS_SYNTAX=PASS"

      - name: Synthetic render smoke, backup, install and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-opening-ending-downloads-yellow-v1.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          PROD=/opt/djgabo-cdg
          STAGE=/tmp/djgabo-opening-ending-downloads-yellow-v1
          TEST=/tmp/djgabo-opening-ending-smoke
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$PROD/backups/opening_ending_downloads_yellow_v1_$STAMP"

          echo "TIMESTAMP=$(date -Is)"
          echo "SCOPE=YELLOW_OPENING_ENDING_DOWNLOADS"
          echo "SOURCE=LIVE_OVH_STAGED_FIRST"
          echo "START_END_MUTATION=NO"

          PROTECTED_BEFORE="$(sudo sha256sum "$PROD/server.py" "$PROD/panel.html" "$PROD/renderer/render.py" "$PROD/renderer/preview.py" | sha256sum | awk '{print $1}')"

          sudo rm -rf "$TEST"
          sudo mkdir -p "$TEST/off" "$TEST/on"

          sudo env TEST="$TEST" STAGE="$STAGE" "$PROD/.venv/bin/python" - <<'PY'
          import copy,json,os,wave
          from pathlib import Path
          test=Path(os.environ["TEST"]);stage=Path(os.environ["STAGE"])
          rate=8000;wav=test/"silent.wav"
          with wave.open(str(wav),"wb") as wf:
              wf.setnchannels(1);wf.setsampwidth(2);wf.setframerate(rate);wf.writeframes(b"\0\0"*(rate*12))
          base={"version":1,"song":{"artist":"TEST","title":"SMOKE","duration":12.0},
            "segments":[{"id":"s0","kind":"lyric","text":"HOLA MUNDO","words":[
              {"id":"w0","text":"HOLA","start_time":4.0,"end_time":4.7,"locked":False,"spoken":False,"vocal_role":None},
              {"id":"w1","text":"MUNDO","start_time":5.0,"end_time":5.8,"locked":False,"spoken":False,"vocal_role":None}]}],
            "calibration_ms":0,
            "cdg_settings":{"lines_per_page":6,"opening_preview_enabled":True,"opening_cdg_enabled":False,"ending_preview_enabled":True,"ending_cdg_enabled":False},
            "render_timeline":{"version":"CDG_RENDER_TIMELINE_V1","clock_origin_seconds":0,"first_real_voice_seconds":4.0,"first_sung_vocal_seconds":4.0,
              "opening":{"enabled":False,"render_screen":False,"start_seconds":0,"duration_seconds":0,"end_seconds":0,"rule":"MANUAL_OFF","first_syllable_buffer_seconds":3},
              "policy":{"json_is_source_of_truth":True,"synthetic_events_affect_opening":False,"composer_intro_delay_seconds":0,"preserve_original_audio_clock":True}}}
          off=copy.deepcopy(base);on=copy.deepcopy(base);on["cdg_settings"]["ending_cdg_enabled"]=True
          (test/"off.json").write_text(json.dumps(off),encoding="utf-8");(test/"on.json").write_text(json.dumps(on),encoding="utf-8")
          style=json.load(open(stage/"renderer/style.json",encoding="utf-8"))
          font=Path("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")
          style["font"]=str(font);style["font_fallback"]=str(font);style["lines_per_page"]=6
          (test/"style.json").write_text(json.dumps(style),encoding="utf-8")
          print("SYNTHETIC_FIXTURE=PASS")
          PY

          sudo env TEST="$TEST" STAGE="$STAGE" "$PROD/.venv/bin/python" - <<'PY'
          import json,os,sys
          from pathlib import Path
          test=Path(os.environ["TEST"]);stage=Path(os.environ["STAGE"])/"renderer"
          sys.path.insert(0,str(stage));sys.path.insert(0,str(stage/"vendor"))
          import normalize as N
          style=json.load(open(test/"style.json",encoding="utf-8"))
          for mode in ("off","on"):
              doc=N.load(test/(mode+".json"))
              before=[(w["start_time"],w["end_time"]) for s in doc["segments"] for w in s["words"]]
              n=N.normalize(doc,dict(style))
              after=[(w["start_time"],w["end_time"]) for s in doc["segments"] for w in s["words"]]
              assert before==after
              toml=N.to_toml(n,dict(style),test/"silent.wav","smoke-"+mode,stage)
              (test/(mode+".toml")).write_text(toml,encoding="utf-8")
              assert 'active_fill = "#FFFF00"' in toml
              assert 'inactive_fill = "#FFFFFF"' in toml
              assert ('outro_enabled = true' in toml)==(mode=="on")
              assert 'intro_duration_seconds = 0.0' in toml
          from cdgmaker.composer import KaraokeComposer
          a=KaraokeComposer.from_file(test/"off.toml");b=KaraokeComposer.from_file(test/"on.toml")
          assert a.config.outro_enabled is False and b.config.outro_enabled is True
          assert tuple(a.config.singers[0].active_fill)==(255,255,0)
          assert tuple(a.config.singers[0].inactive_fill)==(255,255,255)
          print("SIN_ROL_WHITE_TO_FFFF00=PASS")
          print("OPENING_CDG_OFF_DURATION_ZERO=PASS")
          print("ENDING_CONFIG_ON_OFF=PASS")
          print("SOURCE_START_END_UNCHANGED=PASS")
          PY

          sudo timeout 180 "$PROD/.venv/bin/python" "$STAGE/renderer/render.py" "$TEST/off.json" "$TEST/silent.wav" -s "$TEST/style.json" -o "$TEST/off" >"$TEST/off.log" 2>&1
          grep -q "Ending disabled" "$TEST/off.log"
          OFF_CDG="$(find "$TEST/off" -maxdepth 1 -name '*.cdg' -type f | head -1)";test -n "$OFF_CDG"
          OFF_SIZE="$(stat -c %s "$OFF_CDG")";test $((OFF_SIZE%24)) -eq 0

          sudo timeout 180 "$PROD/.venv/bin/python" "$STAGE/renderer/render.py" "$TEST/on.json" "$TEST/silent.wav" -s "$TEST/style.json" -o "$TEST/on" >"$TEST/on.log" 2>&1
          ON_CDG="$(find "$TEST/on" -maxdepth 1 -name '*.cdg' -type f | head -1)";test -n "$ON_CDG"
          ON_SIZE="$(stat -c %s "$ON_CDG")";test $((ON_SIZE%24)) -eq 0
          OFF_PACKETS=$((OFF_SIZE/24));ON_PACKETS=$((ON_SIZE/24))
          test $((ON_PACKETS-OFF_PACKETS)) -ge 1800
          echo "ENDING_OFF_FULL_RENDER=PASS"
          echo "ENDING_ON_FULL_RENDER=PASS"
          echo "ENDING_PACKET_DELTA=$((ON_PACKETS-OFF_PACKETS))"

          sudo mkdir -p "$BACKUP/editor_v1" "$BACKUP/renderer/vendor/cdgmaker" "$BACKUP/vendor"
          sudo cp -a "$PROD/editor_v1/index.html" "$BACKUP/editor_v1/index.html"
          sudo cp -a "$PROD/renderer/style.json" "$BACKUP/renderer/style.json"
          sudo cp -a "$PROD/renderer/normalize.py" "$BACKUP/renderer/normalize.py"
          sudo cp -a "$PROD/renderer/vendor/cdgmaker/composer.py" "$BACKUP/renderer/vendor/cdgmaker/composer.py"
          sudo cp -a "$PROD/renderer/vendor/cdgmaker/config.py" "$BACKUP/renderer/vendor/cdgmaker/config.py"
          sudo cp -a "$PROD/cdg_preview_routes.py" "$BACKUP/cdg_preview_routes.py"
          sudo cp -a "$PROD/vendor/cdg-final-preview.js" "$BACKUP/vendor/cdg-final-preview.js"
          echo "BACKUP=$BACKUP"

          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/index.html" "$PROD/editor_v1/index.html"
          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/renderer/style.json" "$PROD/renderer/style.json"
          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/renderer/normalize.py" "$PROD/renderer/normalize.py"
          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/renderer/vendor/cdgmaker/composer.py" "$PROD/renderer/vendor/cdgmaker/composer.py"
          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/renderer/vendor/cdgmaker/config.py" "$PROD/renderer/vendor/cdgmaker/config.py"
          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/cdg_preview_routes.py" "$PROD/cdg_preview_routes.py"
          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/vendor/cdg-final-preview.js" "$PROD/vendor/cdg-final-preview.js"

          rollback(){
            echo "POSTCHECK_FAILED=ROLLBACK"
            sudo cp -a "$BACKUP/editor_v1/index.html" "$PROD/editor_v1/index.html"
            sudo cp -a "$BACKUP/renderer/style.json" "$PROD/renderer/style.json"
            sudo cp -a "$BACKUP/renderer/normalize.py" "$PROD/renderer/normalize.py"
            sudo cp -a "$BACKUP/renderer/vendor/cdgmaker/composer.py" "$PROD/renderer/vendor/cdgmaker/composer.py"
            sudo cp -a "$BACKUP/renderer/vendor/cdgmaker/config.py" "$PROD/renderer/vendor/cdgmaker/config.py"
            sudo cp -a "$BACKUP/cdg_preview_routes.py" "$PROD/cdg_preview_routes.py"
            sudo cp -a "$BACKUP/vendor/cdg-final-preview.js" "$PROD/vendor/cdg-final-preview.js"
            sudo systemctl restart djgabo-cdg || true
            exit 1
          }

          sudo python3 -m py_compile "$PROD/renderer/normalize.py" "$PROD/renderer/vendor/cdgmaker/composer.py" "$PROD/renderer/vendor/cdgmaker/config.py" "$PROD/cdg_preview_routes.py" || rollback
          sudo systemctl restart djgabo-cdg || rollback
          sleep 2
          test "$(sudo systemctl is-active djgabo-cdg)" = active || rollback
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/editor-v1)" = 200 || rollback
          curl -fsS http://127.0.0.1:8765/editor-v1 | grep -q "DJGABO_OPENING_ENDING_CONTROLS_V1" || rollback
          curl -fsS http://127.0.0.1:8765/api/vendor/cdg-final-preview.js | grep -q "DJGABO_CDG_DOWNLOADS_UI_V1" || rollback
          sudo grep -q "DJGABO_CDG_DOWNLOADS_V1" "$PROD/cdg_preview_routes.py" || rollback
          sudo grep -q '"highlight_default": "#FFFF00"' "$PROD/renderer/style.json" || rollback

          for route in cdg wav zip; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765/api/jobs/LET-0088/download/$route" || true)"
            test "$CODE" != "404" || rollback
            echo "DOWNLOAD_ROUTE_${route^^}_REGISTERED=YES"
          done

          PROTECTED_AFTER="$(sudo sha256sum "$PROD/server.py" "$PROD/panel.html" "$PROD/renderer/render.py" "$PROD/renderer/preview.py" | sha256sum | awk '{print $1}')"
          test "$PROTECTED_BEFORE" = "$PROTECTED_AFTER" || rollback

          echo "PROTECTED_FILES_UNCHANGED=YES"
          echo "SIN_ROL_SWEEP=#FFFF00"
          echo "OPENING_PREVIEW_CONTROL=YES"
          echo "OPENING_CDG_CONTROL=YES"
          echo "ENDING_PREVIEW_CONTROL=YES"
          echo "ENDING_CDG_CONTROL=YES"
          echo "PROJECT_PERSISTENCE=YES"
          echo "DOWNLOAD_CDG=YES"
          echo "DOWNLOAD_WAV=YES"
          echo "DOWNLOAD_ZIP_CDG_WAV=YES"
          echo "SERVICE_ACTIVE=YES"
          echo "HTTP_AFTER=200"
          echo "DEPLOY=OK"
          REMOTE

      - name: Save safe deployment diagnostic
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-opening-ending-downloads-yellow-v1.txt ]; then
            grep -E '^(TIMESTAMP|SCOPE|SOURCE|START_END_MUTATION|SIN_ROL|OPENING_|ENDING_|SOURCE_START|BACKUP|PROTECTED_|DOWNLOAD_|SERVICE_|HTTP_|DEPLOY|POSTCHECK)' \
              diagnostics/cdg-opening-ending-downloads-yellow-v1.txt > diagnostics/cdg-opening-ending-downloads-yellow-v1.safe.txt || true
            rm -f diagnostics/cdg-opening-ending-downloads-yellow-v1.txt
            git add diagnostics/cdg-opening-ending-downloads-yellow-v1.safe.txt
            git commit -m "diag: record Opening Ending downloads yellow deploy" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
