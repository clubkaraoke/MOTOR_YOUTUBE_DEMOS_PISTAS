name: Diagnose KITKARAOKE live state now

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diag-kitkaraoke-live-now.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect read-only live state
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > "$RUNNER_TEMP/OVH_KITKARAOKE_LIVE_NOW.txt" <<'REMOTE'
          set +e
          APP=/opt/KITKARAOKE_DATA_SYNC
          UNIT=kitkaraoke-ingles-migration-005-035

          echo "=== KITKARAOKE LIVE OVH STATE ==="
          date -Is
          echo

          cd "$APP" || { echo "APP_MISSING"; exit 0; }

          echo "=== SAFE ENV ==="
          python3 - <<'PY'
from pathlib import Path
p=Path('/opt/KITKARAOKE_DATA_SYNC/.env')
safe={'DATASET_KEY','SOURCE_PATH','DEST_PATH','BLOCK_PREFIX','BLOCK_SIZE','DRY_RUN','AUTO_SYNC','MIN_EXPECTED_SOURCE_COUNT','COPY_WORKERS','SYNC_INTERVAL_SECONDS','DATA_DIR'}
if not p.exists():
    print('.env MISSING')
else:
    found=0
    for raw in p.read_text(errors='replace').splitlines():
        line=raw.strip()
        if not line or line.startswith('#') or '=' not in line:
            continue
        k,v=line.split('=',1)
        k=k.strip()
        if k.startswith('export '): k=k[7:].strip()
        if k in safe:
            print(f'{k}={v.strip()}')
            found += 1
    print('SAFE_KEYS_FOUND=', found)
PY
          echo

          echo "=== MIGRATION STATE ==="
          sudo cat "$APP/data/migracion_ingles_estado.json" 2>/dev/null || echo "state_file_missing"
          echo

          echo "=== CLI STATUS ==="
          sudo docker compose run --rm --no-deps kitkaraoke-data-sync python -m app.cli status 2>&1
          echo

          echo "=== SYSTEMD ==="
          sudo systemctl is-active "$UNIT" 2>&1
          sudo systemctl is-failed "$UNIT" 2>&1
          sudo systemctl --no-pager --full status "$UNIT" 2>&1 | tail -n 35
          echo

          echo "=== JOURNAL LAST 80 ==="
          sudo journalctl -u "$UNIT" -n 80 --no-pager 2>&1
          echo

          echo "=== DATA FILES ==="
          find "$APP/data" -maxdepth 2 -type f -printf '%p | %s bytes | %TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null | sort
          echo

          echo "=== DOCKER ==="
          sudo docker compose ps 2>&1
          echo

          echo "=== RELEVANT PROCESSES ==="
          ps -eo pid,etime,cmd | grep -E 'migrate_ingles_remaining|copy_block|rclone|kitkaraoke-data-sync' | grep -v grep
          echo

          echo "=== HOST ==="
          df -h / | tail -n 1
          free -h | sed -n '1,2p'
          echo "=== END ==="
          REMOTE

      - name: Save diagnostic result
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/OVH_KITKARAOKE_LIVE_NOW.txt" OVH_KITKARAOKE_LIVE_NOW.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OVH_KITKARAOKE_LIVE_NOW.txt
          git commit -m "diag: save current KITKARAOKE OVH state" || exit 0
          git push origin main
