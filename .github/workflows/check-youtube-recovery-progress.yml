name: Check YouTube recovery progress

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
      - name: Check progress
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          sleep 45
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/djgabo-youtube
          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          from sqlalchemy import func, select
          from app.core.database import SessionLocal
          from app.models.entities import Job, ChannelPublication

          with SessionLocal() as db:
              counts = db.execute(
                  select(Job.status, func.count(Job.id)).group_by(Job.status).order_by(Job.status)
              ).all()
              print("STATUS_COUNTS", {status: count for status, count in counts})
              recent = db.scalars(
                  select(Job).order_by(Job.updated_at.desc()).limit(15)
              ).all()
              for job in recent:
                  print("JOB", job.id[:8], job.status, "progress="+str(job.progress), "channel="+str(job.channel_id), "video="+str(bool(job.youtube_video_id)), "error="+str(job.error_code))
              pubs = db.execute(
                  select(ChannelPublication.channel_id, func.count(ChannelPublication.id))
                  .group_by(ChannelPublication.channel_id)
                  .order_by(ChannelPublication.channel_id)
              ).all()
              print("PUBLICATIONS_TOTAL_BY_CHANNEL", dict(pubs))
          PY
          sudo docker compose -f docker-compose.prod.yml exec -T redis redis-cli LLEN rq:queue:djgabo
          REMOTE
