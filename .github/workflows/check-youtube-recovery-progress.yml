name: Check YouTube recovery progress

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
      - name: Check recovery errors and progress
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/djgabo-youtube
          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          from datetime import datetime, timezone
          from sqlalchemy import func, select
          from app.core.database import SessionLocal
          from app.models.entities import Job

          with SessionLocal() as db:
              counts = db.execute(select(Job.status, func.count(Job.id)).group_by(Job.status).order_by(Job.status)).all()
              print("STATUS_COUNTS", {status: count for status, count in counts})
              rows = db.scalars(
                  select(Job).where(
                      Job.status.in_(["UPLOAD_ERROR","UPLOADING_YOUTUBE","QUEUED","WAITING_SLOT","VERIFYING"])
                  ).order_by(Job.updated_at.desc())
              ).all()
              for job in rows[:25]:
                  updated = job.updated_at if job.updated_at.tzinfo else job.updated_at.replace(tzinfo=timezone.utc)
                  age = int((datetime.now(timezone.utc)-updated).total_seconds())
                  print("JOB", job.id[:8], job.status, "progress="+str(job.progress), "channel="+str(job.channel_id), "age_sec="+str(age), "error_code="+str(job.error_code))
                  if job.error_message:
                      print("ERROR_MESSAGE", job.id[:8], job.error_message[:1800].replace("\n"," "))
          PY
          sudo docker compose -f docker-compose.prod.yml exec -T redis redis-cli LLEN rq:queue:djgabo
          REMOTE
