name: Deploy restore IA real once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-restore-ia-real-once.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Deploy web only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/deploy-restore-ia-real.txt <<'REMOTE'
          set -euo pipefail
          TARGET=/opt/cdg-ia-sync-test
          STAGE=/tmp/cdg-ia-sync-test-main
          ARCHIVE=/tmp/cdg-ia-sync-test-main.tar.gz
          rm -rf "$STAGE" "$ARCHIVE"
          mkdir -p "$STAGE"
          curl -fL --retry 3 -o "$ARCHIVE" https://github.com/clubkaraoke/CDG_IA_SYNC_TEST/archive/refs/heads/main.tar.gz
          tar -xzf "$ARCHIVE" -C "$STAGE" --strip-components=1
          sudo rsync -a --delete --exclude='.env' --exclude='/runtime/' "$STAGE/" "$TARGET/"
          cd "$TARGET"
          sudo docker compose -p cdg-ia-sync-test build cdg-ia-sync-test
          sudo docker compose -p cdg-ia-sync-test up -d --no-deps cdg-ia-sync-test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8097/ >/tmp/lab.html && break
            sleep 2
          done
          grep -q 'restoreAiBtn' /tmp/lab.html
          curl -fsS http://127.0.0.1:8097/static/app.js | grep -q 'ia_result_restored'
          curl -fsS http://127.0.0.1:8097/api/local/health
          echo
          sudo docker ps --filter name=cdg-ia-sync-test --filter name=cdg-ai-sync-cpu --format 'name={{.Names}} status={{.Status}}'
          REMOTE
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/deploy-restore-ia-real.txt ]; then
            git add diagnostics/deploy-restore-ia-real.txt
            git commit -m "diag: deploy restore IA real" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
