name: Inventory FIESTA once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inventory-fiesta-once.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build exact FIESTA inventory (read-only Drive)
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > "$RUNNER_TEMP/FIESTA_INVENTORY_NOW.txt" <<'REMOTE'
          set -euo pipefail
          cd /opt/KITKARAOKE_DATA_SYNC

          echo "=== FIESTA INVENTORY ==="
          date -Is
          echo "SOURCE=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA"
          echo "DEST=KITKARAOKE_APP_DATA/01_FIESTA"
          echo "DATASET=01_FIESTA"
          echo "BLOCK_PREFIX=FIESTA_"
          echo "BLOCK_SIZE=130"
          echo "MODE=READ_ONLY_DRIVE"
          echo

          sudo docker compose run --rm --no-deps             -e DATASET_KEY=01_FIESTA             -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA'             -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA             -e BLOCK_PREFIX=FIESTA_             -e BLOCK_SIZE=130             -e DRY_RUN=true             -e AUTO_SYNC=false             -e MIN_EXPECTED_SOURCE_COUNT=0             kitkaraoke-data-sync python -m app.cli inventory-refresh

          echo
          echo "=== FIESTA STATUS ==="
          sudo docker compose run --rm --no-deps             -e DATASET_KEY=01_FIESTA             -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA'             -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA             -e BLOCK_PREFIX=FIESTA_             -e BLOCK_SIZE=130             -e DRY_RUN=true             -e AUTO_SYNC=false             -e MIN_EXPECTED_SOURCE_COUNT=0             kitkaraoke-data-sync python -m app.cli status
          REMOTE

      - name: Save result
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/FIESTA_INVENTORY_NOW.txt" FIESTA_INVENTORY_NOW.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FIESTA_INVENTORY_NOW.txt
          git commit -m "diag: save exact FIESTA inventory" || exit 0
          git push origin main
