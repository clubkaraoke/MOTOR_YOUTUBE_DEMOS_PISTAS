name: Check FIESTA Drive quota once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-fiesta-drive-quota-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
      - name: Read FIESTA byte totals
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo python3 - <<'PY'
          import sqlite3, json, os
          db='/opt/KITKARAOKE_DATA_SYNC/data/state.sqlite3'
          c=sqlite3.connect(db)
          c.row_factory=sqlite3.Row
          try:
              r=c.execute("SELECT COUNT(*) n, COALESCE(SUM(source_size),0) bytes FROM inventory WHERE dataset_key='01_FIESTA' AND present=1").fetchone()
              x=c.execute("SELECT COUNT(*) n, COALESCE(SUM(source_size),0) bytes FROM inventory WHERE dataset_key='01_FIESTA' AND status='copied'").fetchone()
              print(json.dumps({
                  'fiesta_files': r['n'],
                  'fiesta_bytes': r['bytes'],
                  'fiesta_gib': round(r['bytes']/1024**3, 3),
                  'fiesta_gb_decimal': round(r['bytes']/1e9, 3),
                  'copied_files': x['n'],
                  'copied_gib': round(x['bytes']/1024**3, 3),
                  'copied_gb_decimal': round(x['bytes']/1e9, 3),
              }))
          finally:
              c.close()
          state='/opt/KITKARAOKE_DATA_SYNC/data/fiesta_migration_state.json'
          if os.path.exists(state):
              print(open(state,encoding='utf-8').read())
          PY"
