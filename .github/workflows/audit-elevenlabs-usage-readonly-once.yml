name: Audit ElevenLabs usage read-only once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-elevenlabs-usage-readonly-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure verified SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_EXPECTED_FINGERPRINT: "SHA256:EJvmNCxljj7XEHw7ym3mdvmmbCf+XQxqpbc/XRKnz70"
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          scan="$(mktemp)"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$scan"
          test -s "$scan"
          actual="$(ssh-keygen -lf "$scan" -E sha256 | awk 'NR==1 {print $2}')"
          test "$actual" = "$OVH_EXPECTED_FINGERPRINT"
          mv "$scan" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read sanitized ElevenLabs audit data
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'sudo python3 -' > diagnostics/elevenlabs-usage-readonly.txt <<'PY'
          import collections
          import json
          import sqlite3
          from pathlib import Path
          from datetime import datetime, timezone

          print("AUDIT_MODE=READ_ONLY")
          print("AUDIT_AT=" + datetime.now(timezone.utc).isoformat(timespec="seconds"))

          event_path = Path("/opt/cdg-ia-sync-test/runtime/events.jsonl")
          print("\n=== GATEWAY EVENT LOG ===")
          print(f"EVENT_FILE_EXISTS={event_path.exists()}")
          rows = []
          if event_path.exists():
              for line in event_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  if str(row.get("event", "")).startswith("elevenlabs_"):
                      rows.append(row)

          counts = collections.Counter(str(r.get("event", "")) for r in rows)
          for key in sorted(counts):
              print(f"COUNT {key}={counts[key]}")

          starts = [r for r in rows if str(r.get("event", "")).endswith("_started")]
          scribe_starts = [r for r in starts if r.get("event") == "elevenlabs_scribe_started"]
          forced_starts = [r for r in starts if r.get("event") == "elevenlabs_forced_alignment_started"]
          print(f"TOTAL_EXTERNAL_ATTEMPTS={len(starts)}")
          print(f"SCRIBE_FULL_ATTEMPTS={len(scribe_starts)}")
          print(f"FORCED_ALIGNMENT_ATTEMPTS={len(forced_starts)}")

          print("\n=== EVERY EXTERNAL ATTEMPT (NO LYRICS, NO API KEYS) ===")
          for index, row in enumerate(starts, 1):
              details = row.get("details") if isinstance(row.get("details"), dict) else {}
              safe = {
                  "n": index,
                  "ts": row.get("ts"),
                  "event": row.get("event"),
                  "filename": row.get("filename"),
                  "request_id": row.get("request_id"),
                  "mode": details.get("mode"),
                  "model": details.get("model"),
                  "words": details.get("words"),
              }
              print(json.dumps(safe, ensure_ascii=False, sort_keys=True))

          print("\n=== UNIQUE FULL-SCRIBE AUDIO NAMES ===")
          by_name = collections.Counter(str(r.get("filename") or "(sin nombre)") for r in scribe_starts)
          for name, count in sorted(by_name.items(), key=lambda item: (item[0].casefold(), item[1])):
              print(json.dumps({"filename": name, "attempts": count}, ensure_ascii=False))
          print(f"UNIQUE_FULL_SCRIBE_FILENAMES={len(by_name)}")

          print("\n=== PROJECT DATABASES ===")
          for label, db_path in (
              ("PRODUCTION", Path("/var/lib/djgabo-cdg/local.db")),
              ("IA_TEST", Path("/var/lib/djgabo-cdg-ia-test/local.db")),
          ):
              print(f"-- {label} {db_path} exists={db_path.exists()} --")
              if not db_path.exists():
                  continue
              db = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True)
              db.row_factory = sqlite3.Row
              columns = {r[1] for r in db.execute("pragma table_info(jobs)")}
              wanted = [c for c in ("id", "artist", "title", "origin", "created", "updated", "duration", "project_json") if c in columns]
              query = "select " + ",".join(wanted) + " from jobs"
              for row in db.execute(query).fetchall():
                  item = dict(row)
                  raw = item.pop("project_json", None)
                  try:
                      project = json.loads(raw or "{}")
                  except Exception:
                      project = {}
                  ai = project.get("ai") if isinstance(project.get("ai"), dict) else {}
                  aligns = ai.get("block_alignments") if isinstance(ai.get("block_alignments"), list) else []
                  if ai.get("engine") or aligns or "IA" in str(item.get("origin") or ""):
                      item["ai_engine"] = ai.get("engine")
                      item["ai_generated_at"] = ai.get("generated_at")
                      item["block_alignment_records"] = len(aligns)
                      item["block_alignment_declared_calls"] = sum(int(a.get("calls") or 1) for a in aligns if isinstance(a, dict))
                      print(json.dumps(item, ensure_ascii=False, sort_keys=True))
              db.close()

          print("\n=== ISOLATED RENDER LAB SESSIONS ===")
          session_root = Path("/var/lib/djgabo-cdg-render-lab/sessions")
          print(f"SESSION_ROOT_EXISTS={session_root.exists()}")
          if session_root.exists():
              for meta_path in sorted(session_root.glob("*/meta.json"), key=lambda p: p.stat().st_mtime):
                  try:
                      meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  safe = {k: meta.get(k) for k in ("sid", "artist", "title", "audio_name", "duration", "scribe_status", "created_at", "updated_at")}
                  safe["folder"] = meta_path.parent.name
                  safe["has_scribe_raw"] = (meta_path.parent / "scribe_raw.json").exists()
                  print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY

      - name: Commit sanitized report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/elevenlabs-usage-readonly.txt
          git commit -m "diag: audit ElevenLabs usage read-only" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
