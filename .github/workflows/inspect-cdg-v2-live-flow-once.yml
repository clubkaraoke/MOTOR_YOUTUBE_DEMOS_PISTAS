name: Inspect live CDG V2 essential flow once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-v2-live-flow-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect exact live production panel QR/new-song code
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'sudo python3 -' > diagnostics/cdg-v2-live-essential-flow.txt <<'PY'
          from pathlib import Path
          p=Path("/opt/djgabo-cdg/panel.html")
          s=p.read_text(encoding="utf-8")
          needles=["Pegar QR UVR","No pude cargar el lector QR","btnEnviarNueva","Crear y sincronizar con IA","jsQR","qr"]
          print("FILE",p,"SIZE",len(s))
          for needle in needles:
              print("\n====",needle,"====")
              start=0; hits=0
              low=s.lower(); n=needle.lower()
              while True:
                  i=low.find(n,start)
                  if i<0 or hits>=8: break
                  print(s[max(0,i-1800):min(len(s),i+6500)])
                  print("\n--- HIT END ---")
                  start=i+len(n); hits+=1
              print("HITS",hits)
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-v2-live-essential-flow.txt
          git commit -m "diag: inspect live QR and local lab flow" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
