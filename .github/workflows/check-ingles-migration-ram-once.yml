name: Check INGLES migration RAM once

on:
  push:
    paths:
      - ".github/workflows/check-ingles-migration-ram-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -H "$OVH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Inspect RAM
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          UNIT=kitkaraoke-ingles-migration-005-035.service

          echo "=== SYSTEM RAM ==="
          free -h

          echo "=== SYSTEMD ACCOUNTING ==="
          sudo systemctl show "$UNIT" \
            -p ActiveState \
            -p SubState \
            -p MemoryCurrent \
            -p MemoryPeak \
            -p MemorySwapCurrent \
            -p CPUUsageNSec \
            -p TasksCurrent || true

          echo "=== TOP RELATED PROCESSES ==="
          ps -eo pid,ppid,%mem,rss,vsz,comm,args --sort=-rss | \
            grep -E 'migrate_ingles|copy_block|rclone|python -m app.cli copy-block|docker compose run' | \
            grep -v grep | head -30 || true
          REMOTE
