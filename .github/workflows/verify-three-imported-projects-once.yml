name: Verify three imported projects once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-three-imported-projects-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Verify imported projects
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo test -f /var/lib/djgabo-cdg/jobs/LET-0078/proyecto.timings.json; sudo test -f /var/lib/djgabo-cdg/jobs/LET-0079/proyecto.timings.json; sudo test -f /var/lib/djgabo-cdg/jobs/LET-0080/proyecto.timings.json; echo FILES=OK; echo PROD=\$(sudo systemctl is-active djgabo-cdg); echo HTTP=\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/); sudo python3 -c \"import sqlite3; c=sqlite3.connect('/var/lib/djgabo-cdg/local.db'); print('ROWS='+str(c.execute('select count(*) from jobs where id in (?,?,?)',('LET-0078','LET-0079','LET-0080')).fetchone()[0])); c.close()\""
