name: Inspect CDG repeat-block patch once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-repeat-block-patch-once.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Inspect markers
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-repeat-block-patch-live.txt 2>&1 <<'REMOTE'
          set +e
          ROOT=/opt/djgabo-cdg-ia-test
          echo "TEST=$(sudo systemctl is-active djgabo-cdg-ia-test)"
          echo "PROD=$(sudo systemctl is-active djgabo-cdg)"
          echo "=== SERVER MARKERS ==="
          sudo -u djgabo-cdg grep -nE '_ai_repeat_profile|_ai_alignment_quality|_ai_align_repeat_chunks|repeat_chunks|session\(d.get' "$ROOT/server.py"
          echo "=== EDITOR MARKERS ==="
          sudo -u djgabo-cdg grep -nE 'repetition recalculada|block_alignments.push' "$ROOT/editor_v1/index.html"
          echo "=== COMPILE ==="
          sudo -u djgabo-cdg "$ROOT/.venv/bin/python" -m py_compile "$ROOT/server.py"; echo "PY_COMPILE_RC=$?"
          if command -v node >/dev/null 2>&1; then
            sudo -u djgabo-cdg python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/opt/djgabo-cdg-ia-test/editor_v1/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/cdg-repeat-inspect.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
            node --check /tmp/cdg-repeat-inspect.js; echo "NODE_RC=$?"
          fi
          REMOTE

      - name: Save report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-repeat-block-patch-live.txt
          git commit -m "diag: inspect repeat-block patch live" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
