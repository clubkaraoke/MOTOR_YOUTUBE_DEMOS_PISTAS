name: Deploy to OVH

on:
  push:
    branches: [main]
    paths:
      - "lyrics_engine/**"
      - "deploy/deploy_ovh.sh"
      - ".github/workflows/deploy-ovh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ovh
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run test suite
        run: |
          set -euo pipefail
          python3 --version
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pytest -q -p no:cacheprovider tests

      - name: Validate Motor 03 mirror
        run: |
          set -euo pipefail
          python3 -m compileall -q lyrics_engine
          python3 lyrics_engine/tests/test_text_corrector.py
          test -s lyrics_engine/data/es_50k.txt
          python3 - <<'PY'
          from pathlib import Path
          html = Path("lyrics_engine/web/index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/cdg-lyrics-panel.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/cdg-lyrics-panel.js
          grep -q 'MOTOR 03' deploy/portal/index.html
          grep -q 'location /cdg-lyrics/' deploy/nginx-panel-integrado.conf
          grep -q '127.0.0.1:8090:8090' docker-compose.prod.yml

      - name: Validate deployment secrets
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST"
          test -n "$OVH_PORT"
          test -n "$OVH_SSH_KEY"
          test -n "$OVH_USER"

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_EXPECTED_FINGERPRINT: "SHA256:EJvmNCxljj7XEHw7ym3mdvmmbCf+XQxqpbc/XRKnz70"
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          keyscan_file="$(mktemp)"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$keyscan_file"
          test -s "$keyscan_file"

          actual_fingerprint="$(
            ssh-keygen -lf "$keyscan_file" -E sha256 |
            awk 'NR==1 {print $2}'
          )"

          echo "Verified OVH ED25519 fingerprint: $actual_fingerprint"

          if [ "$actual_fingerprint" != "$OVH_EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: OVH SSH host fingerprint does not match the independently verified fingerprint." >&2
            echo "Expected: $OVH_EXPECTED_FINGERPRINT" >&2
            echo "Actual:   $actual_fingerprint" >&2
            exit 1
          fi

          cp "$keyscan_file" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          rm -f "$keyscan_file"

      - name: Package application
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/djgabo-youtube-${GITHUB_SHA}.tar.gz"

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='./data' \
            --exclude='./data/**' \
            --exclude='backup-*.tgz' \
            -czf "$archive" .

          if ! tar -tzf "$archive" | grep -Fqx './lyrics_engine/data/es_50k.txt'; then
            echo "ERROR: lyrics_engine/data/es_50k.txt is missing from release archive" >&2
            exit 1
          fi

      - name: Upload release archive
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" \
            "$RUNNER_TEMP/djgabo-youtube-${GITHUB_SHA}.tar.gz" \
            "$OVH_USER@$OVH_HOST:/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz"

      - name: Deploy and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash -s -- '/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'" \
            < deploy/deploy_ovh.sh


      - name: Upload release archive
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" \
            "$RUNNER_TEMP/djgabo-youtube-${GITHUB_SHA}.tar.gz" \
            "$OVH_USER@$OVH_HOST:/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz"

      - name: Deploy and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash -s -- '/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'" \
            < deploy/deploy_ovh.sh

      - name: Upload release archive
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" \
            "$RUNNER_TEMP/djgabo-youtube-${GITHUB_SHA}.tar.gz" \
            "$OVH_USER@$OVH_HOST:/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz"

      - name: Deploy and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash -s -- '/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'" \
            < deploy/deploy_ovh.sh


      - name: Upload release archive
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" \
            "$RUNNER_TEMP/djgabo-youtube-${GITHUB_SHA}.tar.gz" \
            "$OVH_USER@$OVH_HOST:/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz"

      - name: Deploy and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash -s -- '/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'" \
            < deploy/deploy_ovh.sh
