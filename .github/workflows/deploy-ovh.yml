name: Deploy to OVH
# One-time trigger: deploy pending privacy queue.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-ovh
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run test suite
        run: |
          set -euo pipefail
          python3 --version
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pytest -q -p no:cacheprovider tests

      - name: Validate Motor 03 mirror
        run: |
          set -euo pipefail
          python3 -m compileall -q lyrics_engine
          grep -q 'MOTOR 03' deploy/portal/index.html
          grep -q 'location /cdg-lyrics/' deploy/nginx-panel-integrado.conf
          grep -q '127.0.0.1:8090:8090' docker-compose.prod.yml

      - name: Validate deployment secrets
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST"
          test -n "$OVH_PORT"
          test -n "$OVH_SSH_KEY"
          test -n "$OVH_USER"

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package application
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='backup-*.tgz' \
            -czf "$RUNNER_TEMP/djgabo-youtube-${GITHUB_SHA}.tar.gz" .

      - name: Upload release archive
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" \
            "$RUNNER_TEMP/djgabo-youtube-${GITHUB_SHA}.tar.gz" \
            "$OVH_USER@$OVH_HOST:/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz"

      - name: Deploy and verify
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash -s -- '/tmp/djgabo-youtube-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'" \
            < deploy/deploy_ovh.sh
