name: Inspect FIESTA after deploy once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-fiesta-after-deploy-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
      - name: Inspect live state
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/KITKARAOKE_DATA_SYNC
          echo "=== FEATURES ==="
          test -f scripts/publish_global_catalog.sh && echo "publish_global_catalog=YES" || echo "publish_global_catalog=NO"
          grep -q 'build-global-catalog' app/cli.py && echo "build_global=YES" || echo "build_global=NO"
          grep -q 'dest_id' app/sync_engine.py && echo "dest_id=YES" || echo "dest_id=NO"
          echo
          echo "=== HEALTH ==="
          curl --fail --silent --show-error http://127.0.0.1:8091/health || true
          echo
          echo "=== FIESTA BLOCK 1 DB ==="
          sudo python3 - <<'PY'
          import sqlite3, json, os
          db='/opt/KITKARAOKE_DATA_SYNC/data/state.sqlite3'
          c=sqlite3.connect(db)
          c.row_factory=sqlite3.Row
          try:
              cols=[r[1] for r in c.execute("PRAGMA table_info(inventory)")]
              print("has_dest_id", "dest_id" in cols)
              q="SELECT status,COUNT(*) n FROM inventory WHERE dataset_key='01_FIESTA' AND block_name='FIESTA_001' GROUP BY status"
              print("statuses", {r['status']:r['n'] for r in c.execute(q)})
              if "dest_id" in cols:
                  n=c.execute("SELECT COUNT(*) FROM inventory WHERE dataset_key='01_FIESTA' AND block_name='FIESTA_001' AND dest_id IS NOT NULL AND TRIM(dest_id)<>''").fetchone()[0]
                  print("with_dest_id", n)
          finally:
              c.close()
          cat='/opt/KITKARAOKE_DATA_SYNC/data/catalogo_universal.json'
          if os.path.exists(cat):
              d=json.load(open(cat,encoding='utf-8'))
              print("catalog_schema", d.get('schema'))
              print("catalog_count", d.get('count'))
              print("datasets", d.get('datasets'))
          else:
              print("catalog_missing")
          PY
          echo
          echo "=== DEST FIESTA_001 ==="
          sudo docker compose run --rm --no-deps \
            -e DATASET_KEY=01_FIESTA \
            -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA' \
            -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA \
            -e BLOCK_PREFIX=FIESTA_ \
            -e BLOCK_SIZE=130 \
            -e DRY_RUN=true \
            -e AUTO_SYNC=false \
            -e MIN_EXPECTED_SOURCE_COUNT=5000 \
            kitkaraoke-data-sync python -m app.cli reconcile-block 1 || true
          REMOTE
