name: Inspect CDG tab source once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-tab-source-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CDG tab sources
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          P=/opt/djgabo-cdg
          echo "=== JS GREP ==="
          sudo grep -nEi 'CDG final|cargado|preview|status|download|stale|desactual' "$P/vendor/cdg-final-preview.js" | head -180 || true
          echo "=== ROUTES GREP ==="
          sudo grep -nEi '@.*cdg|preview|status|download|available|dropbox|cache' "$P/cdg_preview_routes.py" | head -240 || true
          REMOTE
