name: Inspect CDG test projects location once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-test-projects-location-once.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Inspect projects in OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "TIMESTAMP=$(date -Is)"
            echo "=== SERVICES ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "echo PROD=\$(sudo systemctl is-active djgabo-cdg); echo TEST=\$(sudo systemctl is-active djgabo-cdg-ia-test)"
            echo "=== DATA CONSTANTS ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo grep -nE 'ROOT=|DATA=|DB=|JOBS=|sqlite3.connect|/var/lib/djgabo-cdg' /opt/djgabo-cdg/server.py /opt/djgabo-cdg-ia-test/server.py | head -160 || true"
            echo "=== DB FILES ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo find /var/lib/djgabo-cdg /var/lib/djgabo-cdg-ia-test /opt/djgabo-cdg /opt/djgabo-cdg-ia-test -maxdepth 4 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -printf '%p|%s|%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null | sort || true"
            echo "=== TEST MATCHES ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo grep -RaniE --exclude='*.mp3' --exclude='*.wav' --exclude='*.cdg' 'Armonia|Armonía|Laura Leon|Laura León|Mujeres Enga|Amor Rebelde' /var/lib/djgabo-cdg-ia-test /opt/djgabo-cdg-ia-test 2>/dev/null | head -400 || true"
            echo "=== PROD MATCHES ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo grep -RaniE --exclude='*.mp3' --exclude='*.wav' --exclude='*.cdg' 'Armonia|Armonía|Laura Leon|Laura León|Mujeres Enga|Amor Rebelde' /var/lib/djgabo-cdg /opt/djgabo-cdg 2>/dev/null | head -400 || true"
            echo "=== TEST JOB DIRS ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo find /var/lib/djgabo-cdg-ia-test /opt/djgabo-cdg-ia-test -maxdepth 4 -type d -name 'LET-*' -printf '%p|%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null | sort -r | head -60 || true"
            echo "=== PROD JOB DIRS ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo find /var/lib/djgabo-cdg /opt/djgabo-cdg -maxdepth 4 -type d -name 'LET-*' -printf '%p|%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null | sort -r | head -60 || true"
            echo "=== HEALTH ==="
            ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "echo PROD_AFTER=\$(sudo systemctl is-active djgabo-cdg) HTTP=\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/); echo TEST_AFTER=\$(sudo systemctl is-active djgabo-cdg-ia-test) HTTP=\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8775/healthz)"
          } > diagnostics/cdg-test-projects-location.txt

      - name: Commit report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-test-projects-location.txt
          git commit -m "diag: locate IA test projects on OVH" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
