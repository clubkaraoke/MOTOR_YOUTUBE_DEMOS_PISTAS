name: Inspect CDG repeat v5 latest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-repeat-v5-latest.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect latest alignment history
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-repeat-v5-latest.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/djgabo-cdg-ia-test
          cd "$ROOT"
          sudo -u djgabo-cdg env             DJGABO_ENV=test             DJGABO_TEST_MODE=1             DJGABO_URL_PREFIX=/cdg-editor-ia             DJGABO_DATA_DIR=/var/lib/djgabo-cdg-ia-test             DJGABO_CONFIG_DIR=/var/lib/djgabo-cdg-ia-test/config             DJGABO_DB_PATH=/var/lib/djgabo-cdg-ia-test/local.db             DJGABO_JOBS_DIR=/var/lib/djgabo-cdg-ia-test/jobs             DJGABO_OUTPUT_DIR=/var/lib/djgabo-cdg-ia-test/output             DJGABO_VOICE_CACHE_DIR=/var/lib/djgabo-cdg-ia-test/voice_cache             "$ROOT/.venv/bin/python" - <<'PY'
          import json, server
          with server.db() as c:
              r=c.execute("select id,artist,title,project_json,updated from jobs where origin='IA_TEST' order by updated desc limit 1").fetchone()
          row=dict(r)
          doc=json.loads(row.get('project_json') or '{}')
          arr=(doc.get('ai') or {}).get('block_alignments') or []
          print('JOB',row['id'],row['artist'],'-',row['title'],'updated',row['updated'])
          print('COUNT',len(arr))
          for x in arr[-6:]:
              print(json.dumps(x,ensure_ascii=False))
          PY
          echo "TEST=$(sudo systemctl is-active djgabo-cdg-ia-test)"
          echo "PROD=$(sudo systemctl is-active djgabo-cdg)"
          REMOTE
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-repeat-v5-latest.txt
          git commit -m "diag: inspect repeat v5 latest" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
