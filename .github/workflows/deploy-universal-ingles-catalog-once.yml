name: Deploy universal INGLES catalog once

on:
  push:
    paths:
      - ".github/workflows/deploy-universal-ingles-catalog-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout KIT sync catalog build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: clubkaraoke/KITKARAOKE_DATA_SYNC
          ref: 58264781259d215cfac4e0758b9b1a1590830c08
          path: kit-source

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -H "$OVH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Package and upload KIT sync
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          REV=58264781259d215cfac4e0758b9b1a1590830c08
          ARCHIVE="/tmp/kitkaraoke-data-sync-${REV}.tar.gz"
          tar --exclude=.git -czf "$ARCHIVE" -C kit-source .
          scp -P "$OVH_PORT" "$ARCHIVE" "$OVH_USER@$OVH_HOST:$ARCHIVE"

      - name: Deploy, build JSON and publish read-only route
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          REV=58264781259d215cfac4e0758b9b1a1590830c08
          APP=/opt/KITKARAOKE_DATA_SYNC
          ARCHIVE="/tmp/kitkaraoke-data-sync-${REV}.tar.gz"

          sudo bash "$APP/deploy/deploy_ovh.sh" "$ARCHIVE" "$REV"

          cd "$APP"
          sudo docker compose run --rm --no-deps kitkaraoke-data-sync \
            python -m app.cli build-universal-catalog

          SRC="$APP/data/catalogo_universal_03_INGLES.json"
          sudo test -s "$SRC"
          sudo install -d -m 0755 /var/www/kitkaraoke-public
          sudo install -m 0644 "$SRC" /var/www/kitkaraoke-public/03_INGLES.json

          SITE="$(sudo grep -Rsl 'server_name[[:space:]]\+panel\.kitkaraoke\.com' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -1)"
          test -n "$SITE"
          SITE="$(readlink -f "$SITE")"
          sudo cp -a "$SITE" "${SITE}.before-kitkaraoke-catalog"

          if ! sudo grep -q 'KITKARAOKE_UNIVERSAL_CATALOG' "$SITE"; then
            sudo python3 - "$SITE" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text()
lines = text.splitlines(True)

starts = []
depth = 0
for i, line in enumerate(lines):
    stripped = line.split("#", 1)[0]
    opens = stripped.count("{")
    closes = stripped.count("}")
    if "server" in stripped and "{" in stripped:
        starts.append((i, depth))
    depth += opens - closes

target = None
for start, base_depth in starts:
    d = base_depth
    end = None
    for j in range(start, len(lines)):
        stripped = lines[j].split("#", 1)[0]
        d += stripped.count("{") - stripped.count("}")
        if j > start and d == base_depth:
            end = j
            break
    if end is None:
        continue
    block = "".join(lines[start:end+1])
    if "server_name panel.kitkaraoke.com;" in block and "listen 443" in block:
        target = (start, end)
        break

if target is None:
    raise SystemExit("No se encontró server HTTPS de panel.kitkaraoke.com")

_, end = target
snippet = """
    # KITKARAOKE_UNIVERSAL_CATALOG
    location = /catalogo/03_INGLES.json {
        alias /var/www/kitkaraoke-public/03_INGLES.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

"""
lines.insert(end, snippet)
path.write_text("".join(lines))
PY
          fi

          if ! sudo nginx -t; then
            sudo cp -a "${SITE}.before-kitkaraoke-catalog" "$SITE"
            sudo nginx -t
            exit 1
          fi
          sudo systemctl reload nginx

          curl --fail --silent --show-error \
            --resolve panel.kitkaraoke.com:443:127.0.0.1 \
            https://panel.kitkaraoke.com/catalogo/03_INGLES.json \
            -o /tmp/catalog-test.json

          python3 - <<'PY'
import json
p="/tmp/catalog-test.json"
with open(p, encoding="utf-8") as f:
    d=json.load(f)
print({
    "schema": d.get("schema"),
    "count": d.get("count"),
    "blocks": d.get("blocks"),
    "first": d.get("items", [{}])[0].get("relativePath"),
    "has_destination_drive_id": bool(d.get("items", [{}])[0].get("driveFileId")),
})
assert d.get("count") == 4534
assert d.get("blocks") == 35
assert all(x.get("driveFileId") for x in d.get("items", []))
PY
          REMOTE

      - name: Verify public HTTPS catalog
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://panel.kitkaraoke.com/catalogo/03_INGLES.json \
            -o catalog.json
          python3 - <<'PY'
          import json
          with open("catalog.json", encoding="utf-8") as f:
              d=json.load(f)
          print("schema=", d.get("schema"))
          print("count=", d.get("count"))
          print("blocks=", d.get("blocks"))
          assert d.get("count") == 4534
          assert d.get("blocks") == 35
          PY
