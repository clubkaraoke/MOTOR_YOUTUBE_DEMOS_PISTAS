name: Verify animation preview

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" "$OVH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
      - name: Verify C3 preview
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          response=$(curl -fsS -X POST http://127.0.0.1:8088/api/channels/3/animation-preview)
          echo "$response"
          python3 - <<'PY' "$response"
          import json, sys
          data=json.loads(sys.argv[1])
          assert data["first_url"] and data["qr_url"]
          print("PREVIEW_OK", data["channel"], data.get("artist"), data.get("title"))
          PY
          curl -fsS -o /dev/null -w 'FIRST_HTTP=%{http_code} SIZE=%{size_download}\n' http://127.0.0.1:8088/api/channels/3/animation-preview/first
          curl -fsS -o /dev/null -w 'QR_HTTP=%{http_code} SIZE=%{size_download}\n' http://127.0.0.1:8088/api/channels/3/animation-preview/qr
          REMOTE
