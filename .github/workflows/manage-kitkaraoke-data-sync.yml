name: Manage KITKARAOKE DATA SYNC on OVH

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe operation to run
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - deploy
          - install_oauth
          - inventory_refresh
          - reconcile_block
          - copy_block
          - status
      block_number:
        description: Block number for reconcile_block/copy_block
        required: true
        default: "1"
        type: string
      kit_ref:
        description: Branch, tag, or commit from clubkaraoke/KITKARAOKE_DATA_SYNC
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: kitkaraoke-data-sync-ovh
  cancel-in-progress: false

jobs:
  manage:
    name: ${{ inputs.operation }} KITKARAOKE DATA SYNC
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out deployment channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out KITKARAOKE DATA SYNC
        if: inputs.operation == 'deploy' || inputs.operation == 'install_oauth'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: clubkaraoke/KITKARAOKE_DATA_SYNC
          ref: ${{ inputs.kit_ref }}
          path: kit-source

      - name: Validate deployment secrets
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST"
          test -n "$OVH_PORT"
          test -n "$OVH_SSH_KEY"
          test -n "$OVH_USER"

      - name: Validate block input
        if: inputs.operation == 'reconcile_block' || inputs.operation == 'copy_block'
        env:
          BLOCK_NUMBER: ${{ inputs.block_number }}
        run: |
          set -euo pipefail
          if [[ ! "$BLOCK_NUMBER" =~ ^[0-9]{1,4}$ ]]; then
            echo "BLOCK_NUMBER debe ser un entero de 1 a 9999." >&2
            exit 2
          fi
          block_decimal=$((10#$BLOCK_NUMBER))
          if (( block_decimal < 1 || block_decimal > 9999 )); then
            echo "BLOCK_NUMBER fuera de rango." >&2
            exit 2
          fi
          echo "Bloque validado: $block_decimal"

      - name: Configure existing OVH SSH channel
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Resolve KIT revision
        if: inputs.operation == 'deploy'
        id: kit
        working-directory: kit-source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package KIT release
        if: inputs.operation == 'deploy'
        working-directory: kit-source
        env:
          KIT_SHA: ${{ steps.kit.outputs.sha }}
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.github' --exclude='.env' --exclude='data' \
            --exclude='rclone.conf' --exclude='backup-*.tgz' \
            -czf "$RUNNER_TEMP/kitkaraoke-data-sync-${KIT_SHA}.tar.gz" .

      - name: Upload KIT release
        if: inputs.operation == 'deploy'
        env:
          KIT_SHA: ${{ steps.kit.outputs.sha }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" "$RUNNER_TEMP/kitkaraoke-data-sync-${KIT_SHA}.tar.gz" \
            "$OVH_USER@$OVH_HOST:/tmp/kitkaraoke-data-sync-${KIT_SHA}.tar.gz"

      - name: Validate temporary rclone secret
        if: inputs.operation == 'install_oauth'
        env:
          KIT_RCLONE_CONFIG_B64: ${{ secrets.KIT_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KIT_RCLONE_CONFIG_B64"
          printf '%s' "$KIT_RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          sed -i 's/\r$//' "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"
          grep -qx '\[gdrive\]' "$RUNNER_TEMP/rclone.conf"

      - name: Upload protected rclone config
        if: inputs.operation == 'install_oauth'
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" "$RUNNER_TEMP/rclone.conf" \
            "$OVH_USER@$OVH_HOST:/tmp/kitkaraoke-rclone-${GITHUB_RUN_ID}.conf"

      - name: Install OAuth and start isolated dry-run service
        if: inputs.operation == 'install_oauth'
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash -s -- '/tmp/kitkaraoke-rclone-${GITHUB_RUN_ID}.conf'" \
            < kit-source/deploy/install_rclone_ovh.sh

      - name: Deploy KIT release with safety gates
        if: inputs.operation == 'deploy'
        env:
          KIT_SHA: ${{ steps.kit.outputs.sha }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash -s -- '/tmp/kitkaraoke-data-sync-${KIT_SHA}.tar.gz' '${KIT_SHA}'" \
            < kit-source/deploy/deploy_ovh.sh

      - name: Diagnose OVH and isolated KIT service
        if: inputs.operation == 'diagnose' || inputs.operation == 'deploy' || inputs.operation == 'install_oauth'
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            'cd /opt/KITKARAOKE_DATA_SYNC && sudo bash deploy/diagnose_ovh.sh'

      - name: Refresh and persist source inventory
        if: inputs.operation == 'inventory_refresh'
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            'cd /opt/KITKARAOKE_DATA_SYNC && sudo bash scripts/inventory_refresh.sh'

      - name: Reconcile one existing block only
        if: inputs.operation == 'reconcile_block'
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          BLOCK_NUMBER: ${{ inputs.block_number }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "cd /opt/KITKARAOKE_DATA_SYNC && sudo bash scripts/reconcile_block.sh '$BLOCK_NUMBER'"

      - name: Copy one controlled block only
        if: inputs.operation == 'copy_block'
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          BLOCK_NUMBER: ${{ inputs.block_number }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "cd /opt/KITKARAOKE_DATA_SYNC && sudo bash scripts/copy_block.sh '$BLOCK_NUMBER'"

      - name: Show local persisted state
        if: inputs.operation == 'inventory_refresh' || inputs.operation == 'reconcile_block' || inputs.operation == 'copy_block' || inputs.operation == 'status'
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            'cd /opt/KITKARAOKE_DATA_SYNC && sudo docker compose run --rm --no-deps kitkaraoke-data-sync python -m app.cli status'
