name: Deploy multi-dataset and copy FIESTA 001 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-multidataset-fiesta001-once.yml"

permissions:
  contents: write

jobs:
  deploy-and-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Patch live engine, publish English master, then copy FIESTA_001
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > "$RUNNER_TEMP/FIESTA_001_COPY_RESULT.txt" 2>&1 <<'REMOTE'
          set -euo pipefail
          APP=/opt/KITKARAOKE_DATA_SYNC
          cd "$APP"
          stamp="$(date +%Y%m%d-%H%M%S)"
          backup="$APP/backup-fiesta-multidataset-$stamp"
          sudo install -d -m 0750 "$backup"
          
          echo "=== DEPLOY MULTI-DATASET + FIESTA_001 ==="
          date -Is
          echo "backup=$backup"
          echo
          
          echo "=== SAFETY CHECKS ==="
          sudo grep -qx 'DRY_RUN=true' "$APP/.env"
          sudo grep -qx 'AUTO_SYNC=false' "$APP/.env"
          sudo grep -qx 'BLOCK_SIZE=130' "$APP/.env"
          sudo test -f "$APP/rclone.conf"
          echo "OK persistent safety gates"
          
          echo
          echo "=== BACKUP CURRENT FILES ==="
          for f in 'app/cli.py' 'app/db.py' 'app/universal_catalog.py' 'app/sync_engine.py' 'deploy/publish_catalog_nginx.py' 'deploy/publish_universal_catalog.sh' 'scripts/copy_block.sh' 'scripts/publish_global_catalog.sh' 'scripts/reconcile_block.sh'; do
            if sudo test -f "$APP/$f"; then
              sudo install -d -m 0750 "$backup/$(dirname "$f")"
              sudo cp -a "$APP/$f" "$backup/$f"
              echo "BACKUP $f"
            fi
          done
          
          if sudo test -f "$APP/data/state.sqlite3"; then
            sudo python3 - "$APP/data/state.sqlite3" "$backup/state.sqlite3" <<'PY'
          import sqlite3, sys
          src, dst = sys.argv[1], sys.argv[2]
          s = sqlite3.connect(f"file:{src}?mode=ro", uri=True)
          d = sqlite3.connect(dst)
          with d:
              s.backup(d)
          d.close()
          s.close()
          PY
            echo "BACKUP SQLite"
          fi
          
          echo
          echo "=== PATCH LATEST MULTI-DATASET FILES ==="
          echo "PATCH app/cli.py"
          sudo install -d -m 0755 "$APP/$(dirname 'app/cli.py')"
          cat <<'B64_app_cli_py' | base64 -d | sudo tee "$APP/app/cli.py" >/dev/null
          
          B64_app_cli_py
          
          echo "PATCH app/db.py"
          sudo install -d -m 0755 "$APP/$(dirname 'app/db.py')"
          cat <<'B64_app_db_py' | base64 -d | sudo tee "$APP/app/db.py" >/dev/null
          
          B64_app_db_py
          
          echo "PATCH app/universal_catalog.py"
          sudo install -d -m 0755 "$APP/$(dirname 'app/universal_catalog.py')"
          cat <<'B64_app_universal_catalog_py' | base64 -d | sudo tee "$APP/app/universal_catalog.py" >/dev/null
          
          B64_app_universal_catalog_py
          
          echo "PATCH app/sync_engine.py"
          sudo install -d -m 0755 "$APP/$(dirname 'app/sync_engine.py')"
          cat <<'B64_app_sync_engine_py' | base64 -d | sudo tee "$APP/app/sync_engine.py" >/dev/null
          
          B64_app_sync_engine_py
          
          echo "PATCH deploy/publish_catalog_nginx.py"
          sudo install -d -m 0755 "$APP/$(dirname 'deploy/publish_catalog_nginx.py')"
          cat <<'B64_deploy_publish_catalog_nginx_py' | base64 -d | sudo tee "$APP/deploy/publish_catalog_nginx.py" >/dev/null
          
          B64_deploy_publish_catalog_nginx_py
          
          echo "PATCH deploy/publish_universal_catalog.sh"
          sudo install -d -m 0755 "$APP/$(dirname 'deploy/publish_universal_catalog.sh')"
          cat <<'B64_deploy_publish_universal_catalog_sh' | base64 -d | sudo tee "$APP/deploy/publish_universal_catalog.sh" >/dev/null
          
          B64_deploy_publish_universal_catalog_sh
          
          echo "PATCH scripts/copy_block.sh"
          sudo install -d -m 0755 "$APP/$(dirname 'scripts/copy_block.sh')"
          cat <<'B64_scripts_copy_block_sh' | base64 -d | sudo tee "$APP/scripts/copy_block.sh" >/dev/null
          
          B64_scripts_copy_block_sh
          
          echo "PATCH scripts/publish_global_catalog.sh"
          sudo install -d -m 0755 "$APP/$(dirname 'scripts/publish_global_catalog.sh')"
          cat <<'B64_scripts_publish_global_catalog_sh' | base64 -d | sudo tee "$APP/scripts/publish_global_catalog.sh" >/dev/null
          
          B64_scripts_publish_global_catalog_sh
          
          echo "PATCH scripts/reconcile_block.sh"
          sudo install -d -m 0755 "$APP/$(dirname 'scripts/reconcile_block.sh')"
          cat <<'B64_scripts_reconcile_block_sh' | base64 -d | sudo tee "$APP/scripts/reconcile_block.sh" >/dev/null
          
          B64_scripts_reconcile_block_sh
          
          
          sudo chmod 0644 "$APP/app/"*.py
          sudo chmod 0755 "$APP/deploy/publish_catalog_nginx.py" "$APP/deploy/publish_universal_catalog.sh"
          sudo chmod 0755 "$APP/scripts/copy_block.sh" "$APP/scripts/publish_global_catalog.sh" "$APP/scripts/reconcile_block.sh"
          
          echo
          echo "=== REBUILD SERVICE ==="
          sudo docker compose config --quiet
          sudo docker compose up -d --build kitkaraoke-data-sync
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 http://127.0.0.1:8091/health
          echo
          echo "SERVICE HEALTHY"
          
          echo
          echo "=== BOOTSTRAP ENGLISH DESTINATION IDS + MASTER ==="
          sudo bash deploy/publish_universal_catalog.sh
          
          echo
          echo "=== PRECHECK FIESTA_001 (READ ONLY) ==="
          sudo docker compose run --rm --no-deps \
            -e DATASET_KEY=01_FIESTA \
            -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA' \
            -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA \
            -e BLOCK_PREFIX=FIESTA_ \
            -e BLOCK_SIZE=130 \
            -e DRY_RUN=true \
            -e AUTO_SYNC=false \
            -e MIN_EXPECTED_SOURCE_COUNT=5000 \
            kitkaraoke-data-sync python -m app.cli reconcile-block 1
          
          echo
          echo "=== COPY FIESTA_001 ==="
          sudo docker compose run --rm --no-deps \
            -e DATASET_KEY=01_FIESTA \
            -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA' \
            -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA \
            -e BLOCK_PREFIX=FIESTA_ \
            -e BLOCK_SIZE=130 \
            -e DRY_RUN=false \
            -e AUTO_SYNC=false \
            -e MIN_EXPECTED_SOURCE_COUNT=5000 \
            kitkaraoke-data-sync python -m app.cli copy-block 1
          
          echo
          echo "=== PUBLISH UPDATED GLOBAL CATALOG ==="
          sudo bash scripts/publish_global_catalog.sh
          
          echo
          echo "=== POST-VERIFY FIESTA_001 ==="
          sudo docker compose run --rm --no-deps \
            -e DATASET_KEY=01_FIESTA \
            -e 'SOURCE_PATH=01.- Pack Karaoke PRO ( 200 GB ) Club Karaoke - Socio/01.- MEGA PACK KARAOKE - FIESTA' \
            -e DEST_PATH=KITKARAOKE_APP_DATA/01_FIESTA \
            -e BLOCK_PREFIX=FIESTA_ \
            -e BLOCK_SIZE=130 \
            -e DRY_RUN=true \
            -e AUTO_SYNC=false \
            -e MIN_EXPECTED_SOURCE_COUNT=5000 \
            kitkaraoke-data-sync python -m app.cli reconcile-block 1
          
          echo
          echo "=== FINAL COUNTS ==="
          sudo python3 - "$APP/data/state.sqlite3" "$APP/data/catalogo_universal.json" <<'PY'
          import json, sqlite3, sys
          db, cat = sys.argv[1], sys.argv[2]
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row
          row = con.execute(
              "SELECT COUNT(*) n FROM inventory WHERE dataset_key='01_FIESTA' AND block_name='FIESTA_001' AND status='copied' AND dest_id IS NOT NULL AND TRIM(dest_id)<>''"
          ).fetchone()
          total = con.execute(
              "SELECT COUNT(*) n FROM inventory WHERE dataset_key='01_FIESTA' AND status='copied'"
          ).fetchone()
          con.close()
          data = json.load(open(cat, encoding='utf-8'))
          ds = {x['dataset']: x for x in data.get('datasets', [])}
          print({
              "fiesta_001_verified": int(row["n"]),
              "fiesta_total_copied": int(total["n"]),
              "global_count": data.get("count"),
              "global_blocks": data.get("blocks"),
              "global_datasets": ds,
              "schema": data.get("schema"),
          })
          assert int(row["n"]) == 130
          assert data.get("schema") == "kitkaraoke-universal-catalog-v2"
          assert ds.get("01_FIESTA", {}).get("count") == 130
          PY
          
          echo
          echo "SUCCESS: FIESTA_001 copied and published"
          
          REMOTE

      - name: Save result
        if: always()
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/FIESTA_001_COPY_RESULT.txt" FIESTA_001_COPY_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FIESTA_001_COPY_RESULT.txt
          git commit -m "ops: save FIESTA_001 copy result" || exit 0
          git push origin main
