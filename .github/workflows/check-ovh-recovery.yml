name: Check OVH recovery

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Inspect production recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect queue and worker
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/djgabo-youtube
          sudo docker compose -f docker-compose.prod.yml ps
          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from sqlalchemy import func, select
          from app.core.database import SessionLocal
          from app.models.entities import Job

          active_statuses = [
              "QUEUED", "DOWNLOADING_AUDIO", "RENDERING", "VALIDATING",
              "MP4_READY", "WAITING_SLOT", "UPLOADING_YOUTUBE", "VERIFYING", "CLEANUP",
          ]
          with SessionLocal() as db:
              counts = db.execute(
                  select(Job.status, func.count(Job.id)).group_by(Job.status).order_by(Job.status)
              ).all()
              print("JOB_STATUS_COUNTS", {status: count for status, count in counts})
              stale_cutoff = datetime.now(timezone.utc) - timedelta(minutes=10)
              stale = db.scalar(
                  select(func.count(Job.id)).where(
                      Job.status.in_(active_statuses),
                      Job.updated_at < stale_cutoff,
                  )
              ) or 0
              print("STALE_ACTIVE_OVER_10M", stale)
              recent = db.scalars(
                  select(Job).where(Job.status.in_(active_statuses)).order_by(Job.updated_at.desc()).limit(12)
              ).all()
              for job in recent:
                  print(
                      "ACTIVE_JOB",
                      job.id[:8],
                      job.status,
                      f"progress={job.progress}",
                      f"updated_at={job.updated_at}",
                      f"error_code={job.error_code}",
                  )
          PY
          sudo docker compose -f docker-compose.prod.yml exec -T web python - <<'PY'
          from sqlalchemy import select
          from app.core.database import SessionLocal
          from app.models.entities import Channel
          from app.services.youtube import _service

          with SessionLocal() as db:
              channels = db.scalars(select(Channel).order_by(Channel.id)).all()
              for channel in channels:
                  try:
                      response = _service(channel).channels().list(part="id,snippet", mine=True).execute()
                      items = response.get("items", [])
                      title = items[0].get("snippet", {}).get("title") if items else None
                      print("CHANNEL_OAUTH", channel.id, channel.display_name, "OK", title or "SIN_CANAL")
                  except Exception as exc:
                      message = str(exc)
                      if "invalid_grant" in message:
                          reason = "INVALID_GRANT"
                      elif "expired or revoked" in message:
                          reason = "EXPIRED_OR_REVOKED"
                      else:
                          reason = type(exc).__name__
                      print("CHANNEL_OAUTH", channel.id, channel.display_name, "ERROR", reason)
          PY
          sudo docker compose -f docker-compose.prod.yml exec -T worker python - <<'PY'
          from redis import Redis
          from rq.job import Job as RQJob
          from rq.registry import FailedJobRegistry, StartedJobRegistry
          from app.core.config import get_settings

          connection = Redis.from_url(get_settings().redis_url)
          failed = FailedJobRegistry("djgabo", connection=connection)
          started = StartedJobRegistry("djgabo", connection=connection)
          print("RQ_STARTED", started.get_job_ids())
          failed_ids = failed.get_job_ids()[-25:]
          print("RQ_FAILED_COUNT", len(failed.get_job_ids()), "RECENT", failed_ids)
          for rq_id in failed_ids:
              try:
                  rq_job = RQJob.fetch(rq_id, connection=connection)
                  print("RQ_FAILURE", rq_id, (rq_job.exc_info or "")[-3500:])
              except Exception as exc:
                  print("RQ_FAILURE_READ_ERROR", rq_id, type(exc).__name__, str(exc))
          PY
          sudo docker compose -f docker-compose.prod.yml exec -T redis redis-cli LLEN rq:queue:djgabo
          echo "=== WORKER LOG TAIL ==="
          sudo docker compose -f docker-compose.prod.yml logs --tail=220 worker
          REMOTE
