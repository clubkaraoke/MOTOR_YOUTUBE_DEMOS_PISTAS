name: Inspect HABLADO full render smoke once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-hablado-full-render-smoke-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH inspect render log
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -u
          T=/tmp/hablado-contract-smoke
          echo "=== FILES ==="
          find "$T" -maxdepth 2 -type f -printf '%p %s\n' 2>/dev/null | sort || true
          echo "=== RENDER LOG ==="
          test -f "$T/render.log" && tail -220 "$T/render.log" || true
          REMOTE
