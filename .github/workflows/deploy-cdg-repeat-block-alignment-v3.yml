name: Deploy CDG repeat-block alignment v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cdg-repeat-block-alignment-v3.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/patch_cdg_repeat_block_alignment.py
          python3 -m py_compile deploy/cleanup_cdg_repeat_block_alignment.py

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Finalize TEST clone only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          scp -P "$OVH_PORT" deploy/cleanup_cdg_repeat_block_alignment.py "$OVH_USER@$OVH_HOST:/tmp/cleanup_cdg_repeat_block_alignment.py"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-repeat-block-alignment-v3.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/djgabo-cdg-ia-test
          echo "TIMESTAMP=$(date -Is)"
          echo "PROD_BEFORE=$(sudo systemctl is-active djgabo-cdg)"
          echo "TEST_BEFORE=$(sudo systemctl is-active djgabo-cdg-ia-test)"
          test "$(sudo systemctl is-active djgabo-cdg)" = active
          curl -fsS http://127.0.0.1:8765/ >/dev/null

          sudo python3 /tmp/cleanup_cdg_repeat_block_alignment.py
          sudo -u djgabo-cdg "$ROOT/.venv/bin/python" -m py_compile "$ROOT/server.py"

          echo "=== MARKERS ==="
          sudo -u djgabo-cdg grep -Fq "_ai_repeat_profile" "$ROOT/server.py"
          sudo -u djgabo-cdg grep -Fq "_ai_alignment_quality" "$ROOT/server.py"
          sudo -u djgabo-cdg grep -Fq "_ai_align_repeat_chunks" "$ROOT/server.py"
          sudo -u djgabo-cdg grep -Fq "strategy='repeat_chunks'" "$ROOT/server.py"
          sudo -u djgabo-cdg grep -Fq "session(d.get('token'))" "$ROOT/server.py"
          sudo -u djgabo-cdg grep -Fq 'const repeatMsg=j.strategy==="repeat_chunks"' "$ROOT/editor_v1/index.html"
          echo "STATIC_MARKERS=PASS"

          if command -v node >/dev/null 2>&1; then
            sudo -u djgabo-cdg python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/opt/djgabo-cdg-ia-test/editor_v1/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/cdg-repeat-align-v3.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
            node --check /tmp/cdg-repeat-align-v3.js
            echo "EDITOR_JS_SYNTAX=PASS"
          fi

          cd "$ROOT"
          sudo -u djgabo-cdg env             DJGABO_ENV=test             DJGABO_TEST_MODE=1             DJGABO_URL_PREFIX=/cdg-editor-ia             DJGABO_DATA_DIR=/var/lib/djgabo-cdg-ia-test             DJGABO_CONFIG_DIR=/var/lib/djgabo-cdg-ia-test/config             DJGABO_DB_PATH=/var/lib/djgabo-cdg-ia-test/local.db             DJGABO_JOBS_DIR=/var/lib/djgabo-cdg-ia-test/jobs             DJGABO_OUTPUT_DIR=/var/lib/djgabo-cdg-ia-test/output             DJGABO_VOICE_CACHE_DIR=/var/lib/djgabo-cdg-ia-test/voice_cache             "$ROOT/.venv/bin/python" - <<'PY'
          import server
          assert server._ai_repeat_profile([{'text':'LA','id':str(i)} for i in range(40)])['repetitive'] is True
          assert server._ai_repeat_profile([{'text':x,'id':str(i)} for i,x in enumerate('cuando te vi sabia que te queria desde hace mucho tiempo'.split())])['repetitive'] is False
          good=[{'start':i*.35,'end':i*.35+.20} for i in range(20)]
          collapsed=[{'start':i*.35,'end':i*.35+.20} for i in range(5)]
          collapsed += [{'start':1.75,'end':1.751} for _ in range(12)]
          collapsed += [{'start':1.76,'end':5.8},{'start':5.81,'end':6.0},{'start':6.01,'end':6.2}]
          qg=server._ai_alignment_quality(good)
          qb=server._ai_alignment_quality(collapsed)
          assert qg['ok'] is True, qg
          assert qb['ok'] is False, qb
          print('REPEAT_DETECTION=PASS')
          print('COLLAPSE_GUARD=PASS',qb)
          PY

          sudo systemctl restart djgabo-cdg-ia-test
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8775/healthz >/tmp/repeat-v3-health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo "TEST_AFTER=$(sudo systemctl is-active djgabo-cdg-ia-test)"
          echo "PROD_AFTER=$(sudo systemctl is-active djgabo-cdg)"
          prod_http="$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)"
          echo "PROD_HTTP=$prod_http"
          test "$prod_http" = 200
          echo "DEPLOY_REPEAT_BLOCK_ALIGNMENT_V3=OK"
          REMOTE

      - name: Save report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-repeat-block-alignment-v3.txt ]; then
            git add diagnostics/cdg-repeat-block-alignment-v3.txt
            git commit -m "diag: verify repeat-block alignment v3" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
