name: Inspect CDG Editor IA test service once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-editor-ia-test-service.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Fix isolated env and Nginx route
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" deploy/nginx-panel-integrado.conf "$OVH_USER@$OVH_HOST:/tmp/nginx-panel-cdg-editor-ia.conf"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /etc/djgabo-cdg-ia-test
          sudo cp /etc/djgabo-cdg/djgabo-cdg.env /etc/djgabo-cdg-ia-test/djgabo-cdg-ia-test.env
          sudo python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/djgabo-cdg-ia-test/djgabo-cdg-ia-test.env')
          lines=p.read_text(encoding='utf-8').splitlines()
          overrides={
              'DJGABO_ENV':'test',
              'DJGABO_TEST_MODE':'1',
              'DJGABO_URL_PREFIX':'/cdg-editor-ia',
              'DJGABO_DATA_DIR':'/var/lib/djgabo-cdg-ia-test',
              'DJGABO_CONFIG_DIR':'/var/lib/djgabo-cdg-ia-test/config',
              'DJGABO_DB_PATH':'/var/lib/djgabo-cdg-ia-test/local.db',
              'DJGABO_JOBS_DIR':'/var/lib/djgabo-cdg-ia-test/jobs',
              'DJGABO_OUTPUT_DIR':'/var/lib/djgabo-cdg-ia-test/output',
              'DJGABO_VOICE_CACHE_DIR':'/var/lib/djgabo-cdg-ia-test/voice_cache',
              'DJGABO_SKIP_PREV_MIGRATION':'1',
              'DJGABO_BIND':'127.0.0.1:8775',
              'DJGABO_PUBLIC_BASE_URL':'https://panel.kitkaraoke.com/cdg-editor-ia',
              'DROPBOX_REDIRECT_URI':'https://panel.kitkaraoke.com/cdg-editor-ia/dropbox/callback',
              'DROPBOX_APP_KEY':'',
              'DROPBOX_APP_SECRET':'',
              'DROPBOX_REFRESH_TOKEN':'',
              'GUNICORN_CMD_ARGS':'',
          }
          out=[]; seen=set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key=line.split('=',1)[0].strip()
                  if key in overrides:
                      out.append(key+'='+overrides[key]); seen.add(key); continue
              out.append(line)
          for key,val in overrides.items():
              if key not in seen: out.append(key+'='+val)
          p.write_text('\n'.join(out).rstrip()+'\n',encoding='utf-8')
          PY
          sudo chmod 600 /etc/djgabo-cdg-ia-test/djgabo-cdg-ia-test.env
          sudo sed -i 's#^EnvironmentFile=.*#EnvironmentFile=/etc/djgabo-cdg-ia-test/djgabo-cdg-ia-test.env#' /etc/systemd/system/djgabo-cdg-ia-test.service
          sudo sed -i '/^Environment=DJGABO_/d;/^Environment=DROPBOX_/d' /etc/systemd/system/djgabo-cdg-ia-test.service
          sudo systemctl daemon-reload
          sudo systemctl restart djgabo-cdg-ia-test
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8775/healthz >/tmp/ia-health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          sudo cp /tmp/nginx-panel-cdg-editor-ia.conf /etc/nginx/sites-available/panel.kitkaraoke.com
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Inspect test service
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-editor-ia-test-service.txt 2>&1 <<'REMOTE'
          set +e
          echo "TIMESTAMP=$(date -Is)"
          echo "=== STATUS ==="
          sudo systemctl status djgabo-cdg-ia-test --no-pager -l
          echo
          echo "=== JOURNAL ==="
          sudo journalctl -u djgabo-cdg-ia-test -n 120 --no-pager
          echo
          echo "=== PORTS ==="
          sudo ss -ltnp | grep -E ':8765|:8775' || true
          echo
          echo "=== PROCESS ENV SAFE ==="
          PID=$(sudo systemctl show -p MainPID --value djgabo-cdg-ia-test)
          sudo sh -c "tr '\\0' '\\n' < /proc/$PID/environ" | grep -E '^(DJGABO_ENV|DJGABO_TEST_MODE|DJGABO_URL_PREFIX|DJGABO_DATA_DIR|DJGABO_DB_PATH|DJGABO_BIND|DJGABO_CONFIG_DIR|DJGABO_VOICE_CACHE_DIR|DJGABO_OUTPUT_DIR)=' || true
          echo
          echo "=== SAFE EFFECTIVE ENV ==="
          sudo systemctl show djgabo-cdg-ia-test -p Environment --value | tr ' ' '\n' | grep -E '^(DJGABO_ENV|DJGABO_TEST_MODE|DJGABO_URL_PREFIX|DJGABO_DATA_DIR|DJGABO_DB_PATH|DJGABO_BIND|DJGABO_CONFIG_DIR|DJGABO_VOICE_CACHE_DIR|DJGABO_OUTPUT_DIR)=' || true
          echo
          echo "=== UNIT ==="
          sudo systemctl cat djgabo-cdg-ia-test | grep -E '^(EnvironmentFile|Environment=DJGABO_|Environment=DROPBOX_|ExecStart|ReadWritePaths)' || true
          echo
          echo "=== GUNICORN SAFE CONFIG ==="
          sudo grep -nE 'control|bind|GUNICORN|DJGABO' /opt/djgabo-cdg-ia-test/deploy/gunicorn.conf.py || true
          echo
          echo "=== HEALTH ==="
          curl -sS -i http://127.0.0.1:8775/healthz || true
          echo
          echo "=== ROOT ==="
          curl -sS -o /tmp/ia-root.html -w 'HTTP=%{http_code} SIZE=%{size_download}\n' http://127.0.0.1:8775/ || true
          grep -o 'CDG_EDITOR_IA_TEST_BADGE' /tmp/ia-root.html 2>/dev/null | head -1 || true
          echo
          echo "=== DIRECT IMPORT ==="
          cd /opt/djgabo-cdg-ia-test
          sudo -u djgabo-cdg env \
            DJGABO_ENV=test \
            DJGABO_TEST_MODE=1 \
            DJGABO_URL_PREFIX=/cdg-editor-ia \
            DJGABO_DATA_DIR=/var/lib/djgabo-cdg-ia-test \
            DJGABO_CONFIG_DIR=/var/lib/djgabo-cdg-ia-test/config \
            DJGABO_DB_PATH=/var/lib/djgabo-cdg-ia-test/local.db \
            DJGABO_JOBS_DIR=/var/lib/djgabo-cdg-ia-test/jobs \
            DJGABO_OUTPUT_DIR=/var/lib/djgabo-cdg-ia-test/output \
            DJGABO_VOICE_CACHE_DIR=/var/lib/djgabo-cdg-ia-test/voice_cache \
            /opt/djgabo-cdg-ia-test/.venv/bin/python -c "import server; print('IMPORT_OK', server.ENVIRONMENT, server.TEST_MODE, server.URL_PREFIX)"
          REMOTE

      - name: Verify public IA route
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://panel.kitkaraoke.com/cdg-editor-ia/ || true)"
          echo "PUBLIC_ROUTE_HTTP=$code" >> diagnostics/cdg-editor-ia-test-service.txt
          case "$code" in
            200|301|302|303|307|308) ;;
            *) echo "Unexpected public route status: $code" >&2; exit 1 ;;
          esac

      - name: Save report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-editor-ia-test-service.txt
          git commit -m "diag: inspect CDG Editor IA test service" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
