name: Bootstrap CDG Editor IA test

on:
  push:
    branches: [main]
    paths:
      - "deploy/patch_cdg_editor_ia_test.py"
      - "deploy/bootstrap_cdg_editor_ia_test.sh"
      - "deploy/nginx-panel-integrado.conf"
      - ".github/workflows/bootstrap-cdg-editor-ia-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdg-editor-ia-test-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate test package
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/patch_cdg_editor_ia_test.py
          bash -n deploy/bootstrap_cdg_editor_ia_test.sh
          grep -q 'location = /cdg-editor-ia' deploy/nginx-panel-integrado.conf
          grep -q 'DJGABO_TEST_MODE=1' deploy/bootstrap_cdg_editor_ia_test.sh
          grep -q 'DROPBOX_REFRESH_TOKEN=' deploy/bootstrap_cdg_editor_ia_test.sh

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_EXPECTED_FINGERPRINT: "SHA256:EJvmNCxljj7XEHw7ym3mdvmmbCf+XQxqpbc/XRKnz70"
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          keyscan_file="$(mktemp)"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$keyscan_file"
          actual="$(ssh-keygen -lf "$keyscan_file" -E sha256 | awk 'NR==1 {print $2}')"
          test "$actual" = "$OVH_EXPECTED_FINGERPRINT"
          cp "$keyscan_file" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          rm -f "$keyscan_file"

      - name: Upload bootstrap files
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          scp -P "$OVH_PORT" deploy/patch_cdg_editor_ia_test.py "$OVH_USER@$OVH_HOST:/tmp/patch_cdg_editor_ia_test.py"
          scp -P "$OVH_PORT" deploy/bootstrap_cdg_editor_ia_test.sh "$OVH_USER@$OVH_HOST:/tmp/bootstrap_cdg_editor_ia_test.sh"
          scp -P "$OVH_PORT" deploy/nginx-panel-integrado.conf "$OVH_USER@$OVH_HOST:/tmp/nginx-panel-cdg-editor-ia.conf"

      - name: Bootstrap isolated clone
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "bash /tmp/bootstrap_cdg_editor_ia_test.sh /tmp/patch_cdg_editor_ia_test.py /tmp/nginx-panel-cdg-editor-ia.conf" \
            | tee diagnostics/cdg-editor-ia-test-bootstrap.txt

      - name: Verify public route
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://panel.kitkaraoke.com/cdg-editor-ia/ || true)"
          echo "PUBLIC_HTTP=$code" | tee -a diagnostics/cdg-editor-ia-test-bootstrap.txt
          case "$code" in
            200|301|302|303|307|308) ;;
            *) echo "Unexpected public status: $code" >&2; exit 1 ;;
          esac

      - name: Save verification report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-editor-ia-test-bootstrap.txt ]; then
            git add diagnostics/cdg-editor-ia-test-bootstrap.txt
            git commit -m "diag: verify CDG Editor IA isolated bootstrap" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
