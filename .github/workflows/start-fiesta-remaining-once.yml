name: Start remaining FIESTA migration once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/start-fiesta-remaining-once.yml"

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          {
            printf '%s ssh-ed25519 %s\n' "$OVH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
            printf '[%s]:%s ssh-ed25519 %s\n' "$OVH_HOST" "$OVH_PORT" 'AAAAC3NzaC1lZDI1NTE5AAAAICvS+PnyRvMbs7D9w+ZRAhtbGtMnlXvZG1eEp+APNR2V'
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install runner and start blocks 002 to 047
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/copy_fiesta_remaining.sh"
          chmod 0755 "$RUNNER_TEMP/copy_fiesta_remaining.sh"
          scp -P "$OVH_PORT" "$RUNNER_TEMP/copy_fiesta_remaining.sh" "$OVH_USER@$OVH_HOST:/tmp/copy_fiesta_remaining.sh"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo install -m 0755 /tmp/copy_fiesta_remaining.sh /opt/KITKARAOKE_DATA_SYNC/scripts/copy_fiesta_remaining.sh && rm -f /tmp/copy_fiesta_remaining.sh"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "sudo grep -qx 'DRY_RUN=true' /opt/KITKARAOKE_DATA_SYNC/.env && sudo grep -qx 'AUTO_SYNC=false' /opt/KITKARAOKE_DATA_SYNC/.env && sudo grep -qx 'BLOCK_SIZE=130' /opt/KITKARAOKE_DATA_SYNC/.env"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "if sudo systemctl is-active --quiet kitkaraoke-fiesta-migration.service; then echo 'FIESTA migration already active'; else sudo systemctl reset-failed kitkaraoke-fiesta-migration.service 2>/dev/null || true; sudo systemd-run --unit=kitkaraoke-fiesta-migration --description='KITKARAOKE FIESTA blocks 002-047' --property=WorkingDirectory=/opt/KITKARAOKE_DATA_SYNC --property=Nice=5 /bin/bash /opt/KITKARAOKE_DATA_SYNC/scripts/copy_fiesta_remaining.sh 2 47; fi"
          sleep 5
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "echo '=== UNIT ==='; sudo systemctl --no-pager --full status kitkaraoke-fiesta-migration.service || true; echo '=== STATE ==='; sudo cat /opt/KITKARAOKE_DATA_SYNC/data/fiesta_migration_state.json || true; echo '=== LOG TAIL ==='; sudo tail -n 30 /opt/KITKARAOKE_DATA_SYNC/data/fiesta_migration.log || true"
