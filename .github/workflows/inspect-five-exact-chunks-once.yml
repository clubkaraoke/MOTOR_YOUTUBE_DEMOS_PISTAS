name: Inspect five exact chunks once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-five-exact-chunks-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact chunks
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          echo "=== EDITOR HTML ==="; sudo sed -n '905,940p' /opt/djgabo-cdg/editor_v1/index.html
          echo "=== EDITOR RENDER ==="; sudo sed -n '4225,4275p' /opt/djgabo-cdg/editor_v1/index.html
          echo "=== SERVER DB ==="; sudo sed -n '800,850p' /opt/djgabo-cdg/server.py
          echo "=== SERVER RENDER ==="; sudo sed -n '3550,3655p' /opt/djgabo-cdg/server.py
          echo "=== PREVIEW ROUTES META ==="; sudo sed -n '216,246p' /opt/djgabo-cdg/cdg_preview_routes.py
          echo "=== PREVIEW JS LOAD ==="; sudo sed -n '220,252p' /opt/djgabo-cdg/vendor/cdg-final-preview.js
          REMOTE
