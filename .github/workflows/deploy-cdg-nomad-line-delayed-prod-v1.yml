name: Deploy CDG Nomad LINE_DELAYED to production once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cdg-nomad-line-delayed-prod-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preflight patch source
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/cdg_nomad_line_delayed_prod_v1/patch_production.py
          grep -Fq DJGABO_NOMAD_LINE_DELAYED_PROD_V1 deploy/cdg_nomad_line_delayed_prod_v1/patch_production.py
          echo "SOURCE_PREFLIGHT=PASS"

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Stage, smoke, backup, and install scheduler only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          scp -P "$OVH_PORT" deploy/cdg_nomad_line_delayed_prod_v1/patch_production.py \
            "$OVH_USER@$OVH_HOST:/tmp/patch_cdg_nomad_line_delayed_prod_v1.py"

          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' 2>&1 <<'REMOTE' | tee diagnostics/cdg-nomad-line-delayed-prod-v1.txt
          set -euo pipefail
          PROD=/opt/djgabo-cdg
          RENDER="$PROD/renderer"
          SERVICE=djgabo-cdg
          STAGE=/tmp/djgabo-renderer-nomad-line-delayed-v1
          SMOKE=/tmp/djgabo-nomad-line-delayed-smoke
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$PROD/backups/nomad_line_delayed_v1_$STAMP"

          echo "TIMESTAMP=$(date -Is)"
          echo "SCOPE=FINAL_CDG_SCHEDULER_ONLY"
          echo "PREVIEW_UI_CHANGE=NO"
          echo "PANEL_UI_CHANGE=NO"

          test "$(sudo systemctl is-active "$SERVICE")" = active
          BEFORE_HTTP="$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)"
          test "$BEFORE_HTTP" = 200

          PROTECTED_BEFORE="$(sudo sha256sum \
            "$PROD/server.py" \
            "$PROD/panel.html" \
            "$PROD/editor_v1/index.html" \
            "$RENDER/preview.py" \
            "$RENDER/render.py" \
            "$RENDER/style.json" \
            "$RENDER/vendor/cdgmaker/composer.py" \
            "$RENDER/vendor/cdgmaker/config.py" | sha256sum | awk '{print $1}')"
          NORMALIZE_BEFORE="$(sudo sha256sum "$RENDER/normalize.py" | awk '{print $1}')"
          echo "PROTECTED_HASH_BEFORE=$PROTECTED_BEFORE"
          echo "NORMALIZE_HASH_BEFORE=$NORMALIZE_BEFORE"

          echo "=== STAGE CURRENT RENDERER ==="
          sudo rm -rf "$STAGE" "$SMOKE"
          sudo cp -a "$RENDER" "$STAGE"
          sudo python3 /tmp/patch_cdg_nomad_line_delayed_prod_v1.py "$STAGE/normalize.py"
          sudo python3 -m py_compile "$STAGE/normalize.py" "$STAGE/render.py" "$STAGE/vendor/cdgmaker/composer.py" "$STAGE/vendor/cdgmaker/config.py"
          sudo grep -Fq 'DJGABO_NOMAD_LINE_DELAYED_PROD_V1' "$STAGE/normalize.py"
          sudo grep -Fq '"explicit_timeline = false"' "$STAGE/normalize.py"
          sudo grep -Fq '"screen_clear_sync = []"' "$STAGE/normalize.py"
          echo "STAGE_PATCH=PASS"

          echo "=== BUILD READ-ONLY REAL PROJECT SMOKE FROM PRODUCTION DB ==="
          sudo python3 - <<'PY' >/tmp/nomad-smoke-paths
          import json, sqlite3, wave
          from pathlib import Path

          db_candidates=[
              Path("/var/lib/djgabo-cdg/local.db"),
              Path("/var/lib/djgabo-cdg/data/local.db"),
              Path("/opt/djgabo-cdg/data/local.db"),
          ]
          db=next((p for p in db_candidates if p.is_file()),None)
          if db is None:
              raise SystemExit("production local.db not found")

          con=sqlite3.connect(f"file:{db}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row
          rows=[]
          try:
              rows=con.execute("SELECT id,artist,title,project_json,duration FROM jobs WHERE project_json IS NOT NULL AND length(project_json)>20 ORDER BY CASE WHEN id='LET-0088' THEN 0 ELSE 1 END, updated DESC").fetchall()
          except Exception:
              rows=con.execute("SELECT id,artist,title,project_json,duration FROM jobs WHERE project_json IS NOT NULL AND length(project_json)>20").fetchall()

          picked=None
          for row in rows:
              raw=row["project_json"]
              try:
                  doc=json.loads(raw) if isinstance(raw,str) else raw
              except Exception:
                  continue
              if not isinstance(doc,dict):
                  continue
              if doc.get("version")==1 and isinstance(doc.get("segments"),list) and doc.get("segments"):
                  picked=(row,doc); break
          con.close()
          if picked is None:
              raise SystemExit("no usable real project_json found in production DB")

          row,doc=picked
          out=Path("/tmp/nomad-real-project.timings.json")
          out.write_text(json.dumps(doc,ensure_ascii=False),encoding="utf-8")

          duration=float((doc.get("song") or {}).get("duration") or row["duration"] or 90.0)
          duration=max(30.0,min(duration+1.0,600.0))
          wav=Path("/tmp/nomad-real-project-silent.wav")
          rate=8000
          frames=int(duration*rate)
          with wave.open(str(wav),"wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(rate)
              block=b"\0\0"*rate
              while frames:
                  n=min(frames,rate)
                  wf.writeframes(block[:n*2])
                  frames-=n

          print(str(out))
          print(str(wav))
          print(f"{row['id']}|{row['artist']}|{row['title']}")
          PY
          TIMINGS="$(sed -n '1p' /tmp/nomad-smoke-paths)"
          AUDIO="$(sed -n '2p' /tmp/nomad-smoke-paths)"
          SMOKE_JOB="$(sed -n '3p' /tmp/nomad-smoke-paths)"
          echo "SMOKE_TIMINGS=$TIMINGS"
          echo "SMOKE_AUDIO=$AUDIO"
          echo "SMOKE_JOB=$SMOKE_JOB"

          echo "=== VERIFY GENERATED TOML USES NOMAD LINE_DELAYED ==="
          sudo env STAGE="$STAGE" TIMINGS="$TIMINGS" AUDIO="$AUDIO" "$PROD/.venv/bin/python" - <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          stage=Path(os.environ["STAGE"])
          sys.path.insert(0,str(stage))
          sys.path.insert(0,str(stage/"vendor"))
          import normalize as N
          doc=N.load(os.environ["TIMINGS"])
          style=json.load(open(stage/"style.json",encoding="utf-8"))
          n=N.normalize(doc,style)
          toml=N.to_toml(n,style,Path(os.environ["AUDIO"]),"nomad-line-delayed-smoke",stage)
          assert 'clear_mode = "delayed"' in toml, "clear_mode no es delayed"
          assert 'screen_clear_sync = []' in toml, "legacy screen_clear_sync sigue activo"
          assert 'explicit_timeline = false' in toml, "explicit SMART_OVERWRITE sigue activo"
          cfg=Path("/tmp/nomad-line-delayed-config.toml")
          cfg.write_text(toml,encoding="utf-8")
          from cdgmaker.composer import KaraokeComposer
          c=KaraokeComposer.from_file(cfg)
          assert c.config.lyrics[0].explicit_timeline is False
          lt=c.lyric_times[0]
          assert lt.line_draw, "Nomad no calculó line_draw"
          assert lt.line_erase, "Nomad no calculó line_erase"
          print("NOMAD_LINE_DELAYED_CONFIG=PASS")
          print("LINES",len(c.lyrics[0].lines))
          print("FIRST_DRAW_FRAMES",lt.line_draw[:12])
          print("FIRST_ERASE_FRAMES",lt.line_erase[:12])
          PY

          echo "=== FULL REAL CDG SMOKE IN /tmp ==="
          sudo mkdir -p "$SMOKE"
          sudo timeout 240 "$PROD/.venv/bin/python" "$STAGE/render.py" "$TIMINGS" "$AUDIO" -o "$SMOKE" >/tmp/nomad-full-smoke.log 2>&1 || {
            cat /tmp/nomad-full-smoke.log
            echo "FULL_SMOKE=FAIL"
            exit 1
          }
          tail -80 /tmp/nomad-full-smoke.log
          CDG="$(find "$SMOKE" -maxdepth 1 -type f -name '*.cdg' -size +1000c | head -1)"
          test -n "$CDG"
          CDG_SIZE="$(stat -c %s "$CDG")"
          test $((CDG_SIZE % 24)) -eq 0
          echo "FULL_SMOKE=PASS"
          echo "SMOKE_CDG=$CDG"
          echo "SMOKE_CDG_SIZE=$CDG_SIZE"
          echo "SMOKE_PACKETS=$((CDG_SIZE/24))"

          echo "=== BACKUP ==="
          sudo mkdir -p "$BACKUP"
          sudo cp -a "$RENDER/normalize.py" "$BACKUP/normalize.py"
          sudo cp -a "$RENDER/render.py" "$BACKUP/render.py"
          sudo cp -a "$RENDER/preview.py" "$BACKUP/preview.py"
          sudo cp -a "$RENDER/style.json" "$BACKUP/style.json"
          sudo cp -a "$RENDER/vendor/cdgmaker/composer.py" "$BACKUP/composer.py"
          sudo cp -a "$RENDER/vendor/cdgmaker/config.py" "$BACKUP/config.py"
          echo "BACKUP=$BACKUP"

          echo "=== INSTALL ONLY normalize.py ==="
          sudo install -o djgabo-cdg -g djgabo-cdg -m 0644 "$STAGE/normalize.py" "$RENDER/normalize.py"
          sudo python3 -m py_compile "$RENDER/normalize.py"
          sudo grep -Fq 'DJGABO_NOMAD_LINE_DELAYED_PROD_V1' "$RENDER/normalize.py"
          echo "INSTALL=PASS"

          echo "=== SAFETY VERIFY ==="
          PROTECTED_AFTER="$(sudo sha256sum \
            "$PROD/server.py" \
            "$PROD/panel.html" \
            "$PROD/editor_v1/index.html" \
            "$RENDER/preview.py" \
            "$RENDER/render.py" \
            "$RENDER/style.json" \
            "$RENDER/vendor/cdgmaker/composer.py" \
            "$RENDER/vendor/cdgmaker/config.py" | sha256sum | awk '{print $1}')"
          NORMALIZE_AFTER="$(sudo sha256sum "$RENDER/normalize.py" | awk '{print $1}')"
          AFTER_HTTP="$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)"

          test "$PROTECTED_BEFORE" = "$PROTECTED_AFTER"
          test "$NORMALIZE_BEFORE" != "$NORMALIZE_AFTER"
          test "$AFTER_HTTP" = 200
          test "$(sudo systemctl is-active "$SERVICE")" = active

          echo "PROTECTED_HASH_AFTER=$PROTECTED_AFTER"
          echo "NORMALIZE_HASH_AFTER=$NORMALIZE_AFTER"
          echo "PROTECTED_FILES_UNCHANGED=YES"
          echo "PREVIEW_UNCHANGED=YES"
          echo "PANEL_UNCHANGED=YES"
          echo "SERVICE_ACTIVE=YES"
          echo "HTTP_AFTER=$AFTER_HTTP"
          echo "DEPLOY=OK"
          REMOTE

      - name: Save deployment diagnostic
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f diagnostics/cdg-nomad-line-delayed-prod-v1.txt ]; then
            git add diagnostics/cdg-nomad-line-delayed-prod-v1.txt
            git commit -m "diag: record Nomad LINE_DELAYED production deploy" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
