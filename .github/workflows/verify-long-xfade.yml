name: Check xfade retry progress

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" "$OVH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
      - name: Check affected jobs
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          python3 - <<'PY'
          import json, urllib.request
          jobs=json.load(urllib.request.urlopen('http://127.0.0.1:8088/api/jobs'))
          wanted={
            ('Lourdes Huanchaca','Panteonero (En vivo) KARAOKE'),
            ('Celinda Vargas y La Banda Top','No vales nada KARAOKE'),
            ('Celinda Vargas y La Banda Top','No nos comprendemos KARAOKE'),
            ('Zaperoko','Yo no soy un angel (En vivo) KARAOKE (Coro)'),
            ('Masiel Malaga','Por telefono no (En vivo) KARAOKE (Coro)'),
            ('Gaby Zambrano','Mix Marc Antony,No Sabes Como Duele,Te Conozco Bien y Hubo Alguien (Live Session) KARAOKE (Coro)'),
          }
          for j in jobs:
              if (j.get('artist'),j.get('title')) in wanted:
                  print(j.get('artist'),'|',j.get('title'),'|',j.get('status'),'|',j.get('progress'),'|',j.get('error_code') or '')
          PY
          REMOTE
