name: Inspect V2 editor navigation once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-v2-editor-nav-once.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
      - name: Inspect navigation functions
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'sudo python3 -' <<'PY'
          from pathlib import Path
          s=Path("/opt/djgabo-cdg-v2/panel.html").read_text(encoding="utf-8")
          for word in ["function abrirEditor","function mostrarVista","v1-editor-open","v1-editor-mode","function volver","cerrarEditor"]:
              p=0
              print("\n###",word)
              for _ in range(6):
                  i=s.find(word,p)
                  if i<0: break
                  print(s[max(0,i-900):i+2800])
                  p=i+len(word)
          PY
