name: Inspect CDG test projects DB once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-test-projects-db-once.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Query DBs
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'python3 -' > diagnostics/cdg-test-projects-db.txt <<'PY'
import sqlite3, json, os
DBS={'TEST':'/var/lib/djgabo-cdg-ia-test/local.db','PROD':'/var/lib/djgabo-cdg/local.db'}
terms=['armonia','armonía','laura','mujeres enga','amor rebelde']
for label,path in DBS.items():
    print('===',label,path,'===')
    con=sqlite3.connect(path); con.row_factory=sqlite3.Row
    cols=[r[1] for r in con.execute('pragma table_info(jobs)')]
    print('COLUMNS',','.join(cols))
    rows=con.execute("select * from jobs order by id desc limit 140").fetchall()
    for r in rows:
        d=dict(r)
        hay=' '.join(str(d.get(k) or '') for k in ('artist','title','voice_filename','instrumental_filename')).lower()
        if any(t in hay for t in terms):
            keys=['id','artist','title','status','origin','created','updated','voice_filename','voice_original_filename',
                  'instrumental_filename','duration','size_bytes','voice_drive_status','voice_drive_id',
                  'dropbox_status','dropbox_path','dropbox_folder_id','dropbox_display_path',
                  'instrumental_dropbox_path','instrumental_dropbox_id','timings_drive_status','timings_drive_id',
                  'sheet_master_status','cdg_local_filename','canonical_name','render_status','render_progress']
            out={k:d.get(k) for k in keys if k in d}
            pj=d.get('project_json')
            if pj:
                try:
                    p=json.loads(pj)
                    words=[w for s in p.get('segments',[]) for w in s.get('words',[])]
                    out['project_words']=len(words)
                    out['timed_words']=sum(w.get('start_time') is not None for w in words)
                    out['project_ai']=p.get('ai',{})
                except Exception as e: out['project_error']=str(e)
            print(json.dumps(out,ensure_ascii=False))
    con.close()
    print()
print('=== TEST JOB FOLDERS TARGETS ===')
for jid in ['LET-0078','LET-0079','LET-0080','LET-0081','LET-0082','LET-0083']:
    p=f'/var/lib/djgabo-cdg-ia-test/jobs/{jid}'
    if os.path.isdir(p):
        print(jid, sorted((x,os.path.getsize(os.path.join(p,x))) for x in os.listdir(p) if os.path.isfile(os.path.join(p,x))))
print('=== PROD JOB FOLDERS SAME IDS ===')
for jid in ['LET-0078','LET-0079','LET-0080','LET-0081','LET-0082','LET-0083']:
    p=f'/var/lib/djgabo-cdg/jobs/{jid}'
    if os.path.isdir(p):
        print(jid, sorted((x,os.path.getsize(os.path.join(p,x))) for x in os.listdir(p) if os.path.isfile(os.path.join(p,x))))
PY

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-test-projects-db.txt
          git commit -m "diag: inspect target IA test project records" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
