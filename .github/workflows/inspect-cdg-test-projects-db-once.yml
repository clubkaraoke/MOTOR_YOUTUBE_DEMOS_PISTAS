name: Inspect CDG test projects DB once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cdg-test-projects-db-once.yml"
      - "deploy/inspect_cdg_test_projects.py"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Inspect DBs on OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          scp -P "$OVH_PORT" deploy/inspect_cdg_test_projects.py "$OVH_USER@$OVH_HOST:/tmp/inspect_cdg_test_projects.py"
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" "python3 /tmp/inspect_cdg_test_projects.py" > diagnostics/cdg-test-projects-db.txt

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-test-projects-db.txt
          git commit -m "diag: inspect target IA test project records" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
