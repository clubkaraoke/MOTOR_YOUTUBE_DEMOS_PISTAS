name: Deploy CDG IA local preview once v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cdg-ia-local-preview-once-v2.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostics repo
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" -t ed25519 "$OVH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"

      - name: Deploy LAB from public GitHub archive
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' > diagnostics/cdg-ia-local-preview-deploy-v2.txt <<'REMOTE'
          set -euo pipefail
          TARGET=/opt/cdg-ia-sync-test
          STAGE=/tmp/cdg-ia-sync-test-main
          ARCHIVE=/tmp/cdg-ia-sync-test-main.tar.gz

          echo "TIMESTAMP=$(date -Is)"
          echo
          echo "=== BEFORE ==="
          df -h /
          free -h
          sudo docker ps --filter name=cdg-ia-sync-test --format 'name={{.Names}} image={{.Image}} status={{.Status}}'

          rm -rf "$STAGE" "$ARCHIVE"
          mkdir -p "$STAGE"
          curl -fL --retry 3 -o "$ARCHIVE" https://github.com/clubkaraoke/CDG_IA_SYNC_TEST/archive/refs/heads/main.tar.gz
          tar -xzf "$ARCHIVE" -C "$STAGE" --strip-components=1

          sudo install -d -m 755 "$TARGET"
          sudo install -d -m 700 "$TARGET/runtime"
          sudo rsync -a --delete \
            --exclude='.env' \
            --exclude='/runtime/' \
            "$STAGE/" "$TARGET/"

          cd "$TARGET"
          echo
          echo "=== BUILD + RECREATE LAB ONLY ==="
          sudo docker compose -p cdg-ia-sync-test up -d --build --remove-orphans

          echo
          echo "=== VERIFY ==="
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8097/ >/tmp/cdg-ia-home.html; then
              ok=1
              break
            fi
            sleep 2
          done
          [ "$ok" = 1 ]
          grep -q "CDG IA Sync LAB" /tmp/cdg-ia-home.html
          curl -fsS http://127.0.0.1:8097/api/health
          echo
          sudo docker ps --filter name=cdg-ia-sync-test --format 'name={{.Names}} image={{.Image}} status={{.Status}}'
          sudo docker stats --no-stream cdg-ia-sync-test --format 'ram={{.MemUsage}} cpu={{.CPUPerc}}'

          echo
          echo "=== AFTER ==="
          df -h /
          free -h
          rm -rf "$STAGE" "$ARCHIVE"
          REMOTE

      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/cdg-ia-local-preview-deploy-v2.txt
          git commit -m "diag: record CDG IA preview deploy v2" || exit 0
          git push origin HEAD:main
