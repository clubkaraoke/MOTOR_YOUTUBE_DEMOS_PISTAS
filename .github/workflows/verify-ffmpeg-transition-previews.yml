name: Verify FFmpeg transition previews

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$OVH_PORT" "$OVH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
      - name: Verify all four channel previews
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for id in 1 2 3 4; do
            echo "=== C$id ==="
            body=$(curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST "http://127.0.0.1:8088/api/channels/$id/animation-preview")
            echo "$body"
            code=$(printf "%s" "$body" | sed -n "s/^HTTP_CODE://p" | tail -n1)
            json=$(printf "%s" "$body" | sed "/^HTTP_CODE:/d")
            if [ "$code" != "200" ]; then echo "PREVIEW_FAILED C$id HTTP=$code"; break; fi
            body="$json"
            transition=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["transition"])' <<<"$body")
            label=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["transition_label"])' <<<"$body")
            code=$(curl -sS -o "/tmp/c$id.mp4" -w '%{http_code}' "http://127.0.0.1:8088/api/channels/$id/animation-preview/video")
            bytes=$(wc -c < "/tmp/c$id.mp4")
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "/tmp/c$id.mp4")
            echo "C$id TRANSITION=$transition LABEL=$label HTTP=$code BYTES=$bytes DURATION=$duration"
            test "$code" = "200"
            test "$bytes" -gt 10000
          done
          REMOTE
